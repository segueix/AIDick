<!DOCTYPE html>
<html lang="ca">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AIDick — Generador de contes de Philip K. Dick</title>
<style>
:root {
  color-scheme: dark;
  --fons: #0e1014;
  --fons2: #14171d;
  --fons3: #1b1f27;
  --vora: #262b33;
  --text: #e4e6ea;
  --text2: #8b93a1;
  --text3: #5f6874;
  --accent: #7aa2f7;
  --verd: #7bc47f;
  --groc: #d8b25a;
  --vermell: #d8735a;
  --radi: 10px;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--fons);
  color: var(--text);
  font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  font-size: 15px;
  line-height: 1.55;
}
h1, h2, h3 { margin: 0; font-weight: 600; letter-spacing: -0.01em; }
button {
  font: inherit; cursor: pointer; border-radius: 7px; border: 1px solid var(--vora);
  background: var(--fons3); color: var(--text); padding: .5rem .9rem;
}
button:hover:not(:disabled) { background: #232936; border-color: #39414f; }
button:disabled { opacity: .4; cursor: not-allowed; }
button.primari { background: var(--accent); border-color: var(--accent); color: #0b0e13; font-weight: 600; }
button.primari:hover:not(:disabled) { background: #8fb2f8; border-color: #8fb2f8; }
button.resolucio { background: #2a2418; border-color: #4a3d1f; color: #e8cf94; }
button.resolucio:hover:not(:disabled) { background: #362d1c; }
button.petit { padding: .28rem .6rem; font-size: .82rem; }
input, select, textarea {
  font: inherit; background: var(--fons); color: var(--text);
  border: 1px solid var(--vora); border-radius: 7px; padding: .45rem .6rem; width: 100%;
}
textarea { resize: vertical; line-height: 1.5; }
label { display: block; font-size: .82rem; color: var(--text2); margin: .7rem 0 .25rem; }
a { color: var(--accent); }
code { font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size: .88em; }

/* ── Capçalera i panell de progrés ────────────────────────── */
header {
  position: sticky; top: 0; z-index: 20;
  background: rgba(14,16,20,.94); backdrop-filter: blur(8px);
  border-bottom: 1px solid var(--vora);
}
.capcalera-int { max-width: 1080px; margin: 0 auto; padding: .8rem 1.2rem; }
.titol-fila { display: flex; align-items: baseline; gap: .7rem; flex-wrap: wrap; }
.titol-fila h1 { font-size: 1.05rem; }
.titol-fila .subtitol { font-size: .8rem; color: var(--text3); }
.progres { display: flex; gap: 1.4rem; flex-wrap: wrap; margin-top: .55rem; font-size: .8rem; }
.progres > div { display: flex; flex-direction: column; gap: 1px; }
.progres .etiqueta { color: var(--text3); font-size: .72rem; text-transform: uppercase; letter-spacing: .04em; }
.progres .valor { color: var(--text); font-variant-numeric: tabular-nums; }
.progres .valor.alerta { color: var(--groc); }
.progres .valor.perill { color: var(--vermell); }
.barra { height: 3px; background: var(--fons3); border-radius: 2px; overflow: hidden; margin-top: .5rem; }
.barra > span { display: block; height: 100%; background: var(--accent); width: 0; transition: width .3s; }

/* ── Targetes de pas ──────────────────────────────────────── */
main { max-width: 1080px; margin: 0 auto; padding: 1.2rem; }
.targeta {
  background: var(--fons2); border: 1px solid var(--vora);
  border-radius: var(--radi); margin-bottom: 1rem; overflow: hidden;
}
.targeta.actiu { border-color: #33405c; }
.targeta-cap {
  display: flex; align-items: center; gap: .7rem;
  padding: .85rem 1.1rem; cursor: pointer; user-select: none;
}
.targeta-cap:hover { background: #171b22; }
.pas-num {
  flex: 0 0 auto; width: 26px; height: 26px; border-radius: 50%;
  background: var(--fons3); border: 1px solid var(--vora);
  display: grid; place-items: center; font-size: .74rem; color: var(--text2);
  font-variant-numeric: tabular-nums;
}
.targeta.fet .pas-num { background: #1d2e21; border-color: #2f5136; color: var(--verd); }
.targeta.actiu .pas-num { border-color: var(--accent); color: var(--accent); }
.targeta-cap h2 { font-size: .95rem; flex: 1; }
.estat-pas { font-size: .78rem; color: var(--text3); }
.estat-pas.ok { color: var(--verd); }
.estat-pas.avis { color: var(--groc); }
.estat-pas.error { color: var(--vermell); }
.targeta-cos { padding: 0 1.1rem 1.1rem; border-top: 1px solid var(--vora); padding-top: 1rem; }
.targeta.plegat .targeta-cos { display: none; }
.accions { display: flex; gap: .55rem; flex-wrap: wrap; margin-top: 1rem; align-items: center; }
.ajuda { font-size: .82rem; color: var(--text2); margin: .3rem 0 0; }
.reixa2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 0 1rem; }

/* ── Indicador de càrrega ─────────────────────────────────── */
.carregant { display: none; align-items: center; gap: .5rem; font-size: .82rem; color: var(--text2); }
.carregant.visible { display: flex; }
.filador {
  width: 13px; height: 13px; border: 2px solid var(--vora);
  border-top-color: var(--accent); border-radius: 50%;
  animation: gir .7s linear infinite;
}
@keyframes gir { to { transform: rotate(360deg); } }

/* ── Blocatges, avisos i problemes ────────────────────────── */
.blocatge {
  background: #221c12; border: 1px solid #4a3d1f; border-radius: 8px;
  padding: .7rem .85rem; margin-top: .7rem; font-size: .86rem;
}
.blocatge .motiu { color: #e8cf94; }
.blocatge .camp { color: var(--text3); font-size: .78rem; }
.blocatge .accions { margin-top: .6rem; }
.avis {
  background: #1e1614; border: 1px solid #4d2f26; border-radius: 8px;
  padding: .7rem .85rem; margin-top: .7rem; font-size: .86rem; color: #eab6a4;
}
.nota {
  background: var(--fons3); border: 1px solid var(--vora); border-radius: 8px;
  padding: .55rem .8rem; margin-top: .7rem; font-size: .8rem; color: var(--text2);
}
.problema {
  border-left: 3px solid var(--vora); padding: .45rem .7rem;
  margin: .45rem 0; background: var(--fons3); border-radius: 0 6px 6px 0; font-size: .85rem;
}
.problema.alta { border-left-color: var(--vermell); }
.problema.mitjana { border-left-color: var(--groc); }
.problema.baixa { border-left-color: var(--text3); }
.problema .cita { color: var(--text2); font-style: italic; margin-top: .2rem; font-size: .82rem; }
.problema .marca {
  display: inline-block; font-size: .68rem; text-transform: uppercase; letter-spacing: .05em;
  color: var(--text3); border: 1px solid var(--vora); border-radius: 4px;
  padding: 0 .3rem; margin-left: .4rem; vertical-align: 1px;
}

/* ── Llavors i escenes ────────────────────────────────────── */
.llavor {
  border: 1px solid var(--vora); border-radius: 8px; padding: .8rem .95rem;
  margin-bottom: .6rem; cursor: pointer; background: var(--fons3);
}
.llavor:hover { border-color: #39414f; }
.llavor.triada { border-color: var(--accent); background: #1a2130; }
.llavor h3 { font-size: .9rem; margin-bottom: .4rem; }
.llavor dl { margin: 0; font-size: .82rem; }
.llavor dt { color: var(--text3); font-size: .72rem; text-transform: uppercase; letter-spacing: .04em; margin-top: .4rem; }
.llavor dd { margin: 0; color: var(--text2); }

.escena-fitxa { border: 1px solid var(--vora); border-radius: 8px; padding: .75rem .9rem; margin-bottom: .6rem; background: var(--fons3); }
.escena-fitxa .cap { display: flex; align-items: center; gap: .6rem; flex-wrap: wrap; margin-bottom: .5rem; }
.escena-fitxa .cap strong { font-size: .88rem; }
.marca-pkd {
  font-size: .7rem; text-transform: uppercase; letter-spacing: .05em;
  border: 1px solid var(--vora); border-radius: 4px; padding: .05rem .4rem; color: var(--text2);
}
.marca-pkd.esquerda { border-color: #4a3a5c; color: #b79fd4; }
.marca-pkd.mentida  { border-color: #4a3d1f; color: #d8b25a; }
.marca-pkd.paranoia { border-color: #1f3f4a; color: #7fc0d4; }
.marca-pkd.empatia  { border-color: #2f5136; color: var(--verd); }
.escena-fitxa .camps { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: .4rem .9rem; font-size: .8rem; }
.escena-fitxa .camps b { color: var(--text3); font-weight: 500; display: block; font-size: .7rem; text-transform: uppercase; letter-spacing: .04em; }
.escena-fitxa textarea { font-size: .82rem; }

/* ── El text del conte: ha de ser llegible de debò ────────── */
.lectura {
  max-width: 62ch; margin: 1rem 0; font-size: 1.02rem; line-height: 1.85;
  white-space: pre-wrap; color: #dfe2e7;
}
.lectura .separador { color: var(--text3); text-align: center; margin: 1.6rem 0; letter-spacing: .5em; }

table.metrica { width: 100%; border-collapse: collapse; font-size: .83rem; margin-top: .6rem; }
table.metrica th, table.metrica td { text-align: left; padding: .35rem .5rem; border-bottom: 1px solid var(--vora); }
table.metrica th { color: var(--text3); font-weight: 500; font-size: .74rem; text-transform: uppercase; letter-spacing: .04em; }
table.metrica td.num { text-align: right; font-variant-numeric: tabular-nums; }

.semafor { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: .4rem; }
.semafor.verd { background: var(--verd); }
.semafor.groc { background: var(--groc); }
.semafor.vermell { background: var(--vermell); }
.semafor.gris { background: var(--text3); }

.pastilla {
  display: inline-block; font-size: .72rem; padding: .1rem .45rem; border-radius: 4px;
  border: 1px solid var(--vora); color: var(--text2); margin-right: .35rem;
}
.pastilla.demo { border-color: #4a3d1f; color: var(--groc); }
</style>

<body>

<header>
  <div class="capcalera-int">
    <div class="titol-fila">
      <h1>AIDick</h1>
      <span class="subtitol">Contes de 15.000–20.000 caràcters en estil Philip K. Dick, en català</span>
      <span id="pastilla-demo" class="pastilla demo" hidden>Mode demostració</span>
    </div>
    <div class="progres">
      <div><span class="etiqueta">Pas</span><span class="valor" id="pr-pas">P0 · Configuració</span></div>
      <div><span class="etiqueta">Caràcters</span><span class="valor" id="pr-caracters">0 / 17.500</span></div>
      <div><span class="etiqueta">Crides</span><span class="valor" id="pr-crides">0 / 24</span></div>
      <div><span class="etiqueta">Cost estimat</span><span class="valor" id="pr-estimat">—</span></div>
      <div><span class="etiqueta">Cost real</span><span class="valor" id="pr-real">0,000 $</span></div>
    </div>
    <div class="barra"><span id="pr-barra"></span></div>
  </div>
</header>

<main id="passos"></main>

<script src="perfils_autor_base.js"></script>
<script src="models_openai.js"></script>
<script src="nkg_core.js"></script>
<script src="conte_core.js"></script>
<script src="llm_client.js"></script>
<script src="demo_conte.js"></script>
<script>
'use strict';

// ═══════════════════════════════════════════════════════════
//  AIDick — generador de contes PKD
//  Pipeline de 8 passos amb pressupost dur de crides.
//  La lògica pura viu a conte_core.js; el transport, a llm_client.js.
// ═══════════════════════════════════════════════════════════

const NUCLI = globalThis.CONTE_CORE;
const CLIENT = globalThis.LLM_CLIENT;

const CLAU_PROJECTE = 'aidick_conte_projecte';
const CLAU_MOTIUS = 'aidick_motius_usats';
const CLAU_CLAUS_API = 'aidick_claus_api';
const VERSIO_ESQUEMA = 1;

// Sostres per pas, independents del sostre global de 24 crides. Existeixen
// perquè un pas concret no pugui entrar en bucle de correcció, que és
// exactament el patró que encaria el mode novel·la.
const LIMITS_DURS_PAS = {
  costura: 2,   // crida A (estil) + crida B (longitud), i prou
  lectura: 1,   // una sola lectura hostil per conte
  pedac: 2      // dues rondes de pedaç dirigit com a màxim
};

const NOMS_PAS = [
  'P0 · Configuració', 'P1 · Llavor', 'P2 · Dossier', 'P3 · Escaleta',
  'P4 · Redacció', 'P5 · Costura', 'P6 · Auditoria', 'P7 · Lectura hostil', 'P8 · Exportació'
];

// ═══════════════════════════════════════════════════════════
//  ESTAT
// ═══════════════════════════════════════════════════════════

function estatBuit() {
  return {
    versio_esquema: VERSIO_ESQUEMA,
    pas_actual: 0,
    pas_obert: 0,
    config: {
      perfil: (typeof PERFIL_AUTOR_PER_DEFECTE !== 'undefined') ? PERFIL_AUTOR_PER_DEFECTE : 'dick',
      models: { arquitecte: '', prosa: '', lectura: '' },
      claus: { anthropic: '', openai: '', gemini: '' },
      demo: false
    },
    tema: '',
    titol: '',
    titol_al_cos: false,
    motius_conte: [],
    llavors: [],
    llavor_triada: null,
    dossier: NUCLI.crearDossierBuit(),
    dossier_generat: false,
    dossier_complecions: 0,
    escaleta: { escenes: [], justificacio_nombre: '' },
    escenes_text: [],
    text_conte: '',
    pedacos_rebutjats: [],
    costura_feta: 0,
    auditoria: null,
    coherencia: null,
    lectura: null,
    lectura_avis_model: '',
    rondes_pedac: 0,
    estimacio: null,
    avisos: []
  };
}

let ESTAT_CONTE = estatBuit();

// Migració tolerant: un projecte desat amb una versió anterior s'ha de poder
// obrir. Es parteix d'un estat buit i s'hi copia el que existeixi i quadri de
// tipus. Mai es llança: un projecte que no es pot llegir és un projecte perdut.
function migrarEstat(desat) {
  const base = estatBuit();
  if (!desat || typeof desat !== 'object') return base;

  const versio = Number(desat.versio_esquema) || 0;
  const resultat = base;

  Object.keys(base).forEach(clau => {
    if (desat[clau] === undefined || desat[clau] === null) return;
    const esperat = base[clau];
    const rebut = desat[clau];
    if (Array.isArray(esperat)) { if (Array.isArray(rebut)) resultat[clau] = rebut; return; }
    if (esperat && typeof esperat === 'object') {
      if (rebut && typeof rebut === 'object' && !Array.isArray(rebut)) {
        resultat[clau] = Object.assign({}, esperat, rebut);
        Object.keys(esperat).forEach(sub => {
          if (esperat[sub] && typeof esperat[sub] === 'object' && !Array.isArray(esperat[sub])) {
            resultat[clau][sub] = Object.assign({}, esperat[sub], (rebut[sub] && typeof rebut[sub] === 'object') ? rebut[sub] : {});
          }
        });
      }
      return;
    }
    if (typeof rebut === typeof esperat) resultat[clau] = rebut;
  });

  resultat.versio_esquema = VERSIO_ESQUEMA;
  if (versio !== VERSIO_ESQUEMA) {
    resultat.avisos = (resultat.avisos || []).concat([
      `El projecte estava desat amb la versió d'esquema ${versio || 'desconeguda'} i s'ha migrat a la ${VERSIO_ESQUEMA}. Revisa que no hi falti res abans de continuar.`
    ]);
  }
  return resultat;
}

function desarEstat() {
  try {
    const copia = JSON.parse(JSON.stringify(ESTAT_CONTE));
    copia.comptador = JSON.parse(JSON.stringify(CLIENT.comptador));
    delete copia.config.claus; // les claus van a part i no s'exporten mai amb el projecte
    localStorage.setItem(CLAU_PROJECTE, JSON.stringify(copia));
    localStorage.setItem(CLAU_CLAUS_API, JSON.stringify(ESTAT_CONTE.config.claus || {}));
  } catch (e) {
    console.warn('No s\'ha pogut desar el projecte:', e && e.message);
  }
}

function carregarEstat() {
  let desat = null;
  try { desat = JSON.parse(localStorage.getItem(CLAU_PROJECTE) || 'null'); }
  catch (e) { console.warn('El projecte desat no es pot llegir; se n\'obre un de nou.'); }

  ESTAT_CONTE = migrarEstat(desat);

  try {
    const claus = JSON.parse(localStorage.getItem(CLAU_CLAUS_API) || '{}');
    ESTAT_CONTE.config.claus = Object.assign({ anthropic: '', openai: '', gemini: '' }, claus);
  } catch (e) { /* claus il·legibles: es queden buides */ }

  if (desat && desat.comptador) CLIENT.restaurarComptador(desat.comptador);
  if (ESTAT_CONTE.config.demo) DEMO_CONTE.DemoConte.instalar();
}

function motiusUsats() {
  try { return JSON.parse(localStorage.getItem(CLAU_MOTIUS) || '[]'); } catch (e) { return []; }
}

function registrarMotiusUsats(ids) {
  const previs = motiusUsats();
  const nous = previs.concat(ids.filter(id => previs.indexOf(id) < 0));
  try { localStorage.setItem(CLAU_MOTIUS, JSON.stringify(nous)); } catch (e) { /* quota plena */ }
}

// ═══════════════════════════════════════════════════════════
//  UTILITATS
// ═══════════════════════════════════════════════════════════

function esc(text) {
  return String(text == null ? '' : text)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}

function num(n) { return Number(n || 0).toLocaleString('ca-ES'); }
function usd(n) { return Number(n || 0).toFixed(3).replace('.', ',') + ' $'; }

function textConteComplet() {
  const trossos = (ESTAT_CONTE.escenes_text || []).filter(t => String(t || '').trim());
  return trossos.join(NUCLI.SEPARADOR_ESCENA);
}

// El text viu de treball: després de P5 és el text apedaçat; abans, la
// concatenació de les escenes.
function textActual() {
  return ESTAT_CONTE.text_conte || textConteComplet();
}

function perfilActual() { return ESTAT_CONTE.config.perfil || 'dick'; }

// ═══════════════════════════════════════════════════════════
//  MUNTATGE DE PROMPTS
//
//  Dues funcions de sistema i cap més. blocSistemaGeneracio és l'ÚNICA que
//  poden fer servir els passos que escriuen (llavor, dossier, escaleta, escena,
//  costura, pedaç) i NO llegeix mai criterisAvaluacioConte.
//  blocSistemaLectura és l'única que sí que els llegeix, i només la fa servir
//  la lectura hostil. Si els criteris d'avaluació arribessin al generador,
//  l'examen mesuraria el seu propi enunciat i el veredicte deixaria de valdre.
// ═══════════════════════════════════════════════════════════

const DIRECTIVA_LLENGUA =
  "Escrius EXCLUSIVAMENT en català. Cap paraula, frase ni comentari en anglès o en castellà. " +
  "Conserva l'onomàstica i els topònims nord-americans del món de Dick: la llengua de redacció és el català, " +
  "però el món narrat no es catalanitza (no converteixis John en Joan ni Sacramento en cap topònim català).";

function blocSistemaGeneracio(opcions) {
  const o = opcions || {};
  const id = perfilActual();
  const p = PERFILS_AUTOR[id] || {};
  const parts = [];

  parts.push(p.estil || '');
  if (o.reglesDures !== false) parts.push(p.regles_dures || '');
  if (o.prosa) parts.push([p.prosa, p.exposicio, p.emocio, p.intensitat].filter(Boolean).join('\n'));
  // La variació de registre només té sentit quan s'està escrivint prosa: al
  // corrector i a l'arquitectura no hi pinta res.
  if (o.prosa) parts.push(blocConte(id, 'prosa_variacio'));
  if (o.forma !== false) parts.push(blocFormaConte(id));
  if (o.obertura) parts.push(blocOberturaConte(id));
  if (o.desenllac) parts.push(blocDesenllacConte(id));

  if (o.excellencia) {
    const criteris = criterisExcellenciaConte(id);
    if (criteris.length) {
      parts.push('CONDICIONS D\'ACCEPTACIÓ D\'AQUEST TEXT:\n' +
        criteris.map((c, i) => `${i + 1}. ${c}`).join('\n') +
        '\nNo les enunciïs ni les comentis dins de la ficció: encarna-les en acció, objecte, gest o decisió.');
    }
  }

  if (o.corrector) {
    parts.push('Ara actues com a corrector d\'estil d\'aquest mateix autor: no reescrius, assenyales i proposes canvis mínims.');
  }

  parts.push(DIRECTIVA_LLENGUA);
  return parts.filter(x => String(x || '').trim()).join('\n\n');
}

function blocSistemaLectura() {
  const id = perfilActual();
  const p = PERFILS_AUTOR[id] || {};
  const criteris = criterisAvaluacioConte(id);
  return [
    'Ets un lector hostil. La teva feina és trobar el pitjor d\'aquest conte, no valorar-lo.',
    p.estil || '',
    criteris.length
      ? 'CRITERIS AMB ELS QUALS HAS DE JUTJAR:\n' + criteris.map((c, i) => `${i + 1}. ${c}`).join('\n')
      : '',
    'PROHIBIT: posar cap nota o puntuació, resumir l\'argument, elogiar res, suggerir com millorar-ho amb generalitats.',
    DIRECTIVA_LLENGUA
  ].filter(x => String(x || '').trim()).join('\n\n');
}

function blocTopicsProhibits() {
  return 'PROHIBIT fer servir literalment cap d\'aquests noms, marques o termes, que són de l\'obra de Dick i de les seves adaptacions:\n' +
    NUCLI.TOPICS_PROHIBITS.join(' · ') +
    '\nL\'objectiu és escriure com Dick, no fer un pastitx de les seves pel·lícules.';
}

function blocMotius(motius) {
  return 'MOTIUS QUE HAS DE COMBINAR EN AQUESTES PROPOSTES:\n' +
    motius.map((m, i) => `${i + 1}. ${m.motiu}\n   Tensió que obre: ${m.tensio}\n   Clixé que has d'esquivar: ${m.evita}`).join('\n');
}

// blocTopicsProhibits prohibeix NOMS; això prohibeix MECANISMES, que és el que
// tornava disfressat amb un altre vocabulari. La llista viu a
// NUCLI.MOTIUS_VETATS i és editable des del codi, no des d'aquest string.
// La forma compacta (només els noms) és la que va a cada escena, perquè la
// llarga multiplicada per cinc escenes seria pressupost d'entrada llençat.
function blocMotiusVetats(opcions) {
  const o = opcions || {};
  const llista = NUCLI.MOTIUS_VETATS || [];
  if (o.compacte) {
    return 'MECANISMES VETATS. No en pot entrar cap en aquesta escena, encara que no siguin a la premissa:\n' +
      llista.map(m => `· ${m.mecanisme}`).join('\n');
  }
  return 'MECANISMES VETATS. Cap llavor no pot partir de cap d\'aquests, ni disfressat amb un altre vocabulari:\n' +
    llista.map((m, i) => `${i + 1}. ${m.mecanisme}\n   Com torna disfressat: ${m.disfressa}`).join('\n') +
    '\n\nL\'estil de Dick és la manera d\'escriure la paranoia burocràtica i ontològica, no aquest catàleg d\'objectes. ' +
    'Un conte que en recombina dos o tres no és un conte nou: és un recull de grans èxits.';
}

// Els criteris de llengua que no es poden comprovar per codi. Van al corrector,
// no al redactor: són control de qualitat, no estil.
function blocCriterisLlengua() {
  const llista = NUCLI.CRITERIS_LLENGUA_REVISIO || [];
  return 'LLENGUA — busca també aquests tres defectes, que no es detecten amb cap llista tancada:\n' +
    llista.map((c, i) => `${i + 1}. ${c.criteri}\n   Exemple del defecte: ${c.exemple}`).join('\n');
}

// ═══════════════════════════════════════════════════════════
//  CRIDES
// ═══════════════════════════════════════════════════════════

function cridesFetesAlPas(pas) {
  const p = CLIENT.comptador.per_pas[pas];
  return p ? p.crides : 0;
}

function comprovarLimitPas(pas) {
  const limit = LIMITS_DURS_PAS[pas];
  if (limit === undefined) return;
  if (cridesFetesAlPas(pas) >= limit) {
    const e = new Error(`El pas «${pas}» ja ha gastat les ${limit} crides que té assignades. No en farà cap més: la correcció automàtica en bucle és exactament el que encaria el sistema. Continua a mà o accepta el resultat tal com és.`);
    e.esLimitPas = true;
    throw e;
  }
}

function opcionsCrida(pas, sistema, usuari, maxTokens) {
  const tria = CLIENT.triarModelPerPas(pas, ESTAT_CONTE.config);
  if (!tria.model) throw new Error(`No hi ha cap model configurat per al pas «${pas}». Torna a P0 i tria els models.`);
  const proveidor = CLIENT.proveidorDelModel(tria.model);
  const apiKey = (ESTAT_CONTE.config.claus || {})[proveidor];
  if (!apiKey) throw new Error(`Falta la clau API de ${proveidor}, que és el proveïdor del model triat per al pas «${pas}».`);
  return {
    opcions: { pas, model: tria.model, apiKey, maxTokens, sistema, missatges: [{ role: 'user', content: usuari }] },
    tria
  };
}

async function cridarText(pas, sistema, usuari, maxTokens) {
  comprovarLimitPas(pas);
  const { opcions } = opcionsCrida(pas, sistema, usuari, maxTokens);
  const r = await CLIENT.cridarModel(opcions);
  desarEstat();
  return r;
}

async function cridarJSON(pas, sistema, usuari, maxTokens, claus) {
  comprovarLimitPas(pas);
  const { opcions } = opcionsCrida(pas, sistema, usuari, maxTokens);
  const r = await CLIENT.cridarModelJSON(opcions, claus);
  desarEstat();
  return r;
}

function promptLlavors(motius) {
  return [
    ESTAT_CONTE.tema ? `Tema o punt de partida que ha donat l'usuari: ${ESTAT_CONTE.tema}` : 'L\'usuari no ha donat cap tema: tria tu el terreny.',
    blocMotius(motius),
    blocTopicsProhibits(),
    blocMotiusVetats(),
    `Proposa SIS llavors de conte. Cadascuna és un objecte amb aquests camps exactes, i els dos primers els has d'escriure ABANS que cap altre:
- anomalia: UNA anomalia nova, en una sola frase. És d'on surt tot el conte i no n'hi pot haver cap altra. Administrativa o domèstica, mai còsmica.
- justificacio_originalitat: per què aquesta anomalia no és cap dels mecanismes vetats. Digues a quin s'assembla més i què la'n separa. Si per justificar-la has de forçar l'argument, canvia-la: vol dir que és el mecanisme vetat amb una altra roba.
- premissa: la situació de partida en una frase, amb l'anomalia dins.
- esquerda: en una frase, què és el que el lector descobrirà que no era real.
- mentida_del_sistema: quina institució menteix i amb quina dada es pot comprovar dins del text.
- final_obligatori: el desenllaç concret en una frase. Desinflat, ambigu o de broma sinistra; mai un tancament de rosca.
- protagonista: nom, feina ordinària de rang baix i la ferida que el fa seguir quan hauria de parar.
- problemes_quotidians: array de DOS problemes de vida quotidiana sense CAP relació amb l'anomalia ni amb la trama (un deute, una dent, una exdona, una pensió d'aliments, una mudança, un cap que el menysprea, una digestió). No es resolen mai i no es connecten amb el desenllaç.
- cost_empatia: quina decisió empàtica li costarà alguna cosa concreta.
- titol: d'UNA a QUATRE paraules, tret d'un terme o d'una frase de la mateixa llavor. Sense comes. PROHIBIT el patró «nom del protagonista + ofici».`,
    `PROHIBICIONS:
- Cap protagonista escollit, predestinat ni excepcional.
- Cap revelació per confessió d'un personatge.
- Cap final que restauri l'estat inicial.
- Cap final amb revelació d'última línia que reordeni tot el conte (que l'expedient porti el nom del protagonista, que la víctima fos ell, que la data fos una altra).
- Cap paraula en anglès.
- Les sis llavors han de ser diferents entre elles: sis variants de la mateixa idea no serveixen.`,
    'Format: JSON estricte amb la clau "llavors", un array de 6 objectes. Res més: cap text abans ni després.'
  ].join('\n\n');
}

async function generarLlavors() {
  const motius = NUCLI.triarMotius(motiusUsats(), 3);
  ESTAT_CONTE.motius_conte = motius.map(m => m.id);

  const r = await cridarJSON('llavor',
    blocSistemaGeneracio({ forma: true }),
    promptLlavors(motius),
    3000, ['llavors']);

  const llavors = Array.isArray(r.dades.llavors) ? r.dades.llavors.filter(l => l && l.premissa) : [];
  ESTAT_CONTE.llavors = llavors;
  ESTAT_CONTE.llavor_triada = null;

  // Menys de sis llavors NO es reclama amb una segona crida: s'ensenya el que
  // hi ha i queda el botó de regenerar. Un pas que en gasta dues per cosmètica
  // és exactament el que fa car el sistema.
  if (llavors.length === 0) throw new Error('El model no ha retornat cap llavor utilitzable. Prova de regenerar.');
  if (llavors.length < 6) {
    ESTAT_CONTE.avisos.push(`El model n'ha retornat ${llavors.length} en lloc de 6. Es mostren les que han arribat; no es gasta una segona crida per completar-les.`);
  }
  registrarMotiusUsats(ESTAT_CONTE.motius_conte);
}

function triarLlavor(i) {
  const l = ESTAT_CONTE.llavors[i];
  if (!l) return;
  ESTAT_CONTE.llavor_triada = i;

  const d = ESTAT_CONTE.dossier;
  d.premissa = l.premissa || '';
  d.anomalia = l.anomalia || '';
  d.anomalia_justificacio = l.justificacio_originalitat || '';
  d.esquerda = l.esquerda || '';
  d.mentida_del_sistema = l.mentida_del_sistema || '';
  d.final_obligatori = l.final_obligatori || '';
  d.cost_empatia = l.cost_empatia || '';
  d.motius_triats = ESTAT_CONTE.motius_conte.slice();

  // Els dos problemes quotidians viatgen de la llavor al dossier tal com han
  // arribat: el pas de dossier els pot refinar, però no els ha de tornar a
  // inventar.
  const quotidians = Array.isArray(l.problemes_quotidians)
    ? l.problemes_quotidians.map(x => String(x || '').trim()).filter(x => NUCLI.esTextUtil(x))
    : [];
  if (quotidians.length && !(d.protagonista.problemes_quotidians || []).filter(NUCLI.esTextUtil).length) {
    d.protagonista.problemes_quotidians = quotidians.slice(0, 2);
  }

  // El camp 'protagonista' de la llavor és una frase; el dossier el desglossa a
  // P2. Aquí només se'n guarda el nom si es pot deduir sense inventar res.
  const prota = String(l.protagonista || '').trim();
  if (prota && !NUCLI.esTextUtil(d.protagonista.nom)) {
    const nom = prota.split(/[,;.]/)[0].trim();
    if (nom && nom.split(/\s+/).length <= 4) d.protagonista.nom = nom;
  }

  ESTAT_CONTE.titol = ESTAT_CONTE.titol || proposarTitol(l);
  avancarFins(2);
}

// El títol el proposa la llavor, que l'ha tret d'un terme del conte mateix. Si
// no en porta o no passa validarTitolConte —massa paraules, una coma, el patró
// nom + ofici—, se'n deriva un de LOCAL: el terme més llarg de l'anomalia. Un
// títol d'una paraula sempre compleix el format, i la interfície el deixa
// editar. Aquí no es gasta cap crida: un títol no val una crida al model.
function proposarTitol(llavor) {
  const l = (llavor && typeof llavor === 'object') ? llavor : { premissa: String(llavor || '') };
  const candidat = String(l.titol || '').trim().replace(/[.…]$/, '');
  if (candidat && NUCLI.validarTitolConte(candidat, ESTAT_CONTE.dossier).valid) return candidat;

  const font = String(l.anomalia || l.premissa || '').trim();
  const terme = font.toLowerCase()
    .split(/[^\p{L}\p{N}·'-]+/u)
    .filter(p => p.length >= 6)
    .sort((a, b) => b.length - a.length)[0];
  if (!terme) return 'Conte sense títol';
  return terme.charAt(0).toUpperCase() + terme.slice(1);
}

const ESQUEMA_DOSSIER_TEXT = `{
  "premissa": "...", "anomalia": "...", "anomalia_justificacio": "...",
  "final_obligatori": "...", "esquerda": "...",
  "mentida_del_sistema": "...", "cost_empatia": "...",
  "protagonista": {
    "nom": "...", "feina_ordinaria": "...", "ferida": "...",
    "objectiu_extern": "...", "secret": "...",
    "problemes_quotidians": ["...", "..."],
    "veu": { "registre": "...", "mai_diria": ["...", "...", "..."] }
  },
  "secundaris": [ { "nom": "...", "funcio": "...", "vol": "...", "amaga": "..." } ],
  "mon": { "lloc": "...", "any": "...", "deteriorament": ["...","...","..."],
           "objectes_consum_defectuosos": ["...","..."] },
  "objectes_clau": [ { "nom": "...", "on_es": "...", "per_a_que": "..." } ],
  "fets_canonics": ["...", "...", "...", "..."],
  "cronologia": [ { "quan": "...", "que": "..." } ],
  "motius_triats": []
}`;

function promptDossier() {
  const l = ESTAT_CONTE.llavors[ESTAT_CONTE.llavor_triada] || {};
  return [
    'LLAVOR TRIADA:\n' + JSON.stringify(l, null, 2),
    `Converteix aquesta llavor en el dossier del conte. Omple l'esquema exacte del dossier:\n${ESQUEMA_DOSSIER_TEXT}`,
    blocConte(perfilActual(), 'vida_quotidiana'),
    `REGLES:
- anomalia: la mateixa de la llavor, en una frase. És l'única anomalia del conte i cap escena no en pot afegir una segona.
- anomalia_justificacio: la justificació d'originalitat de la llavor, retallada.
- protagonista.problemes_quotidians: exactament 2, els de la llavor. Sense cap relació amb l'anomalia, sense resolució i sense connexió amb el desenllaç. Concrets i avorrits: una quota, una dent, una trucada de la mare, una gotera, un cotxe.
- protagonista.veu.mai_diria: exactament 3 frases senceres que aquest personatge no diria mai. Serviran de control de veu.
- mon.deteriorament: exactament 3 detalls que mostrin que el futur és el present deteriorat, no el present lluent.
- mon.objectes_consum_defectuosos: exactament 2 objectes quotidians amb el defecte concret (marca mal impresa, logotip desalineat, botó que respon tard).
- secundaris: entre 1 i 3, cadascun amb què vol i què amaga.
- objectes_clau: entre 0 i 4.
- fets_canonics: entre 4 i 8 fets inamovibles, cadascun comprovable dins del text: una xifra, una data, una ubicació o una relació.
- cronologia: entre 3 i 6 fites en ordre.
- PROHIBIT qualsevol camp buit i qualsevol "per determinar".
- BREVETAT: cap camp de text no pot passar de 160 caràcters. El dossier viatja
  sencer dins de cada crida d'escena; si s'infla, encareix totes les escenes.
  Escriu-lo com una fitxa, no com una redacció.`,
    'Format: JSON estricte amb aquest esquema. Res més.'
  ].join('\n\n');
}

async function generarDossier() {
  const r = await cridarJSON('dossier',
    blocSistemaGeneracio({ forma: true }),
    promptDossier(), 3000,
    ['premissa', 'protagonista', 'mon', 'fets_canonics']);

  // Fusió que no pot buidar res del que la llavor ja havia omplert.
  ESTAT_CONTE.dossier = NUCLI.fusionarDossierSenseBuidar(ESTAT_CONTE.dossier, r.dades);
  ESTAT_CONTE.dossier.motius_triats = ESTAT_CONTE.motius_conte.slice();
  ESTAT_CONTE.dossier_generat = true;
}

// Intent LOCAL i determinista d'omplir els forats. No gasta cap token i és el
// camí de resolució que ha de funcionar encara que la crida al model falli.
function completarDossierLocalment() {
  const d = ESTAT_CONTE.dossier;
  const l = ESTAT_CONTE.llavors[ESTAT_CONTE.llavor_triada] || {};
  const omplerts = [];
  const posar = (obj, camp, valor, etiqueta) => {
    if (!NUCLI.esTextUtil(obj[camp]) && NUCLI.esTextUtil(valor)) { obj[camp] = valor; omplerts.push(etiqueta); }
  };

  posar(d, 'premissa', l.premissa, 'premissa');
  posar(d, 'anomalia', l.anomalia || d.premissa, 'anomalia');
  posar(d, 'anomalia_justificacio', l.justificacio_originalitat, 'anomalia_justificacio');
  posar(d, 'esquerda', l.esquerda, 'esquerda');
  posar(d, 'mentida_del_sistema', l.mentida_del_sistema, 'mentida_del_sistema');
  posar(d, 'final_obligatori', l.final_obligatori, 'final_obligatori');
  posar(d, 'cost_empatia', l.cost_empatia, 'cost_empatia');

  const p = d.protagonista;
  const fraseProta = String(l.protagonista || '');
  posar(p, 'nom', fraseProta.split(/[,;.]/)[0], 'protagonista.nom');
  posar(p, 'feina_ordinaria', fraseProta.split(/[,;]/)[1], 'protagonista.feina_ordinaria');
  posar(p, 'ferida', fraseProta.split(/[,;]/).slice(2).join(', '), 'protagonista.ferida');
  posar(p, 'objectiu_extern', d.premissa ? `Resoldre l'anomalia sense que ningú hi miri dues vegades: ${NUCLI.retallar(d.premissa, 90)}` : '', 'protagonista.objectiu_extern');
  posar(p, 'secret', d.cost_empatia ? `El que ja ha decidit callar: ${NUCLI.retallar(d.cost_empatia, 90)}` : '', 'protagonista.secret');
  posar(p.veu, 'registre', 'Sec i procedimental; frases curtes, precisió de qui treballa amb impresos', 'protagonista.veu.registre');

  // Els problemes quotidians: primer els de la llavor, i si no n'hi ha, dos de
  // base. Han de ser reemplaçables sense pensar-hi: el que importa és que
  // n'hi hagi dos i que no toquin la trama.
  if (!Array.isArray(p.problemes_quotidians)) p.problemes_quotidians = [];
  const quotidiansLlavor = Array.isArray(l.problemes_quotidians) ? l.problemes_quotidians : [];
  quotidiansLlavor.forEach(q => {
    if (p.problemes_quotidians.filter(NUCLI.esTextUtil).length < 2 && NUCLI.esTextUtil(q)) {
      p.problemes_quotidians.push(String(q).trim());
      omplerts.push('protagonista.problemes_quotidians');
    }
  });
  const quotidiansBase = [
    'Deu tres mensualitats del dentista i li truquen a la feina per cobrar-les',
    'L\'exdona li reclama uns mobles que ell ja no té i no ho sap com dir-l\'hi'
  ];
  while (p.problemes_quotidians.filter(NUCLI.esTextUtil).length < 2) {
    p.problemes_quotidians.push(quotidiansBase[p.problemes_quotidians.length % quotidiansBase.length]);
    omplerts.push('protagonista.problemes_quotidians');
  }
  if (p.problemes_quotidians.length > 2) {
    p.problemes_quotidians = p.problemes_quotidians.slice(0, 2);
    omplerts.push('protagonista.problemes_quotidians');
  }

  if (!Array.isArray(p.veu.mai_diria)) p.veu.mai_diria = [];
  const maiDiriaBase = [
    'El sistema sempre acaba tenint raó i jo no sóc ningú per discutir-ho',
    'Prefereixo no saber res de tot això i seguir com si res',
    'Això no és cosa meva i no penso perdre-hi ni un minut més'
  ];
  while (p.veu.mai_diria.filter(NUCLI.esTextUtil).length < 3) {
    const seguent = maiDiriaBase[p.veu.mai_diria.length % maiDiriaBase.length];
    p.veu.mai_diria.push(seguent);
    omplerts.push('protagonista.veu.mai_diria');
  }

  if (!Array.isArray(d.secundaris)) d.secundaris = [];
  if (d.secundaris.filter(s => s && NUCLI.esTextUtil(s.nom)).length === 0) {
    d.secundaris.push({
      nom: 'El funcionari de finestreta',
      funcio: 'Aplica el procediment que bloqueja el protagonista',
      vol: 'Acabar el torn sense cap incidència registrada',
      amaga: 'Sap que el procediment té una excepció i té ordre de no esmentar-la'
    });
    omplerts.push('secundaris');
  }

  posar(d.mon, 'lloc', 'Una ciutat industrial nord-americana amb administració pròpia', 'mon.lloc');
  posar(d.mon, 'any', 'Una dècada endavant, sense que res sembli nou', 'mon.any');

  if (!Array.isArray(d.mon.deteriorament)) d.mon.deteriorament = [];
  const deteriorBase = [
    'Un aparell del sostre s\'atura i torna a engegar-se sol des de fa tres estius',
    'Arreglar el que està espatllat requereix un imprès que es demana a una altra planta',
    'Els fluorescents fan un brunzit constant que només se sent quan el pis queda buit'
  ];
  while (d.mon.deteriorament.filter(NUCLI.esTextUtil).length < 3) {
    d.mon.deteriorament.push(deteriorBase[d.mon.deteriorament.length % deteriorBase.length]);
    omplerts.push('mon.deteriorament');
  }

  if (!Array.isArray(d.mon.objectes_consum_defectuosos)) d.mon.objectes_consum_defectuosos = [];
  const objectesBase = [
    'Els segells de goma han perdut mitja lletra i deixen l\'empremta incompleta',
    'Les carpetes noves porten el logotip desplaçat un mil·límetre cap avall'
  ];
  while (d.mon.objectes_consum_defectuosos.filter(NUCLI.esTextUtil).length < 2) {
    d.mon.objectes_consum_defectuosos.push(objectesBase[d.mon.objectes_consum_defectuosos.length % objectesBase.length]);
    omplerts.push('mon.objectes_consum_defectuosos');
  }

  if (!Array.isArray(d.fets_canonics)) d.fets_canonics = [];
  if (d.fets_canonics.filter(NUCLI.esTextUtil).length < 1 && NUCLI.esTextUtil(d.premissa)) {
    d.fets_canonics.push(`L'anomalia del conte és aquesta i cap altra: ${NUCLI.retallar(d.premissa, 120)}`);
    omplerts.push('fets_canonics');
  }
  if (d.fets_canonics.length > 8) { d.fets_canonics = d.fets_canonics.slice(0, 8); omplerts.push('fets_canonics'); }

  if (!Array.isArray(d.cronologia)) d.cronologia = [];
  if (d.cronologia.filter(c => c && NUCLI.esTextUtil(c.quan) && NUCLI.esTextUtil(c.que)).length < 1) {
    d.cronologia.push({ quan: 'El primer dia', que: NUCLI.retallar(d.premissa || 'Apareix l\'anomalia', 110) });
    omplerts.push('cronologia');
  }
  if (d.cronologia.length > 6) { d.cronologia = d.cronologia.slice(0, 6); omplerts.push('cronologia'); }
  if (Array.isArray(d.secundaris) && d.secundaris.length > 3) { d.secundaris = d.secundaris.slice(0, 3); omplerts.push('secundaris'); }
  if (Array.isArray(d.objectes_clau) && d.objectes_clau.length > 4) { d.objectes_clau = d.objectes_clau.slice(0, 4); omplerts.push('objectes_clau'); }

  return [...new Set(omplerts)];
}

// Una sola crida de compleció, i només per als camps que segueixin faltant
// després de l'intent local.
async function completarDossierAmbModel(faltants) {
  const camps = faltants.map(f => f.camp);
  const r = await cridarJSON('dossier',
    blocSistemaGeneracio({ forma: true }),
    [
      'DOSSIER ACTUAL (no el reescriguis sencer):\n' + JSON.stringify(ESTAT_CONTE.dossier, null, 2),
      'Falten NOMÉS aquests camps:\n' + faltants.map(f => `- ${f.camp}: ${f.motiu}`).join('\n'),
      'Retorna un JSON amb NOMÉS aquests camps, amb la mateixa estructura anidada que tenen al dossier. No incloguis cap camp que ja tingui valor.',
      'Format: JSON estricte. Res més.'
    ].join('\n\n'),
    2000, []);

  // Fusió que no pot buidar cap camp que ja tenia valor.
  ESTAT_CONTE.dossier = NUCLI.fusionarDossierSenseBuidar(ESTAT_CONTE.dossier, r.dades);
  ESTAT_CONTE.dossier_complecions += 1;
  return camps;
}

// ═══════════════════════════════════════════════════════════
//  P3 — ESCALETA
// ═══════════════════════════════════════════════════════════

function promptEscaleta() {
  return [
    'DOSSIER DEL CONTE:\n' + JSON.stringify(ESTAT_CONTE.dossier, null, 2),
    `Escriu l'escaleta del conte. Entre ${NUCLI.CONTE_MIN_ESCENES} i ${NUCLI.CONTE_MAX_ESCENES} escenes: tria tu el nombre exacte i justifica'l.`,
    `Cada escena porta aquests camps exactes:
- pov: qui mira
- lloc: on passa
- present: array amb qui hi és
- objectiu_pov: què vol el punt de vista en aquesta escena
- obstacle: què concret l'hi impedeix
- objecte_o_informacio_en_disputa: què es disputa materialment
- decisio_irreversible: què decideix que ja no pot desfer
- cost_immediat: què perd en aquesta mateixa escena
- consequencia: què canvia a partir d'ara
- funcio_pkd: un de "esquerda", "mentida", "paranoia", "empatia" o "cap"
- escena_ferida: true en UNA sola escena, false a la resta`,
    blocConte(perfilActual(), 'nucli_emocional'),
    `REGLES:
- Almenys una escena amb funcio_pkd "esquerda", una amb "mentida" i una amb "empatia".
- EXACTAMENT una escena amb escena_ferida: true. És l'escena on la ferida del protagonista —"${esc(NUCLI.retallar(ESTAT_CONTE.dossier.protagonista.ferida, 120))}"— és la matèria de l'escena i no una menció. No pot ser la mateixa escena que executa el final.
- Cap escena pot ser un resum temàtic ni una formulació moral abstracta.
- Cap escena sense objectiu visible, sense obstacle concret, sense cost immediat i sense conseqüència.
- Cada decisio_irreversible ha de ser una acció física amb la seva cadena causal: si el que decideix el protagonista provoca un efecte, l'escaleta ha de dir per quin camí el provoca. Un efecte que passa perquè convé a la trama és màgia.
- L'última escena ha d'executar exactament el final_obligatori del dossier: "${esc(ESTAT_CONTE.dossier.final_obligatori)}", i no pot contenir cap revelació que reordeni el que s'ha llegit.`,
    'Format: JSON estricte { "escenes": [...], "justificacio_nombre": "..." }. Res més.'
  ].join('\n\n');
}

async function generarEscaleta() {
  const r = await cridarJSON('escaleta',
    blocSistemaGeneracio({ forma: true, obertura: true, desenllac: true }),
    promptEscaleta(), 4000, ['escenes']);

  let escenes = Array.isArray(r.dades.escenes) ? r.dades.escenes : [];
  if (escenes.length < NUCLI.CONTE_MIN_ESCENES || escenes.length > NUCLI.CONTE_MAX_ESCENES) {
    ESTAT_CONTE.avisos.push(`El model ha proposat ${escenes.length} escenes i el marge és ${NUCLI.CONTE_MIN_ESCENES}–${NUCLI.CONTE_MAX_ESCENES}. S'ha ajustat per codi.`);
    escenes = escenes.slice(0, NUCLI.CONTE_MAX_ESCENES);
    while (escenes.length < NUCLI.CONTE_MIN_ESCENES) escenes.push({});
  }

  aplicarEscaleta(escenes, r.dades.justificacio_nombre || '');
}

// Reparteix el pressupost, completa els contractes amb fallback LOCAL (mai amb
// una segona crida) i deixa constància de quins camps s'han hagut de tapar.
function aplicarEscaleta(escenesCrues, justificacio) {
  const pesos = NUCLI.pesosPerEscenes(escenesCrues);
  const pressupost = NUCLI.repartirCaracters(NUCLI.CONTE_OBJECTIU_CARACTERS, escenesCrues.length, pesos);

  const contractes = escenesCrues.map((e, i) => {
    const brut = Object.assign({}, e, { caracters_objectiu: pressupost[i] });
    const { contracte, camps_omplerts } = NUCLI.completarContracteAmbFallback(
      Object.assign({ index: i }, brut), ESTAT_CONTE.dossier, pressupost[i]);
    if (camps_omplerts.length) {
      ESTAT_CONTE.avisos.push(`Escena ${i + 1}: el model no ha donat ${camps_omplerts.join(', ')}. S'ha completat en local, sense cap crida.`);
    }
    return contracte;
  });

  // L'escena de la ferida es comprova aquí i s'avisa, però no es tapa: si el
  // fallback la pogués declarar, la declararia sempre i deixaria de mesurar res,
  // exactament com passaria amb la porta PKD.
  const iFerida = NUCLI.indexEscenaFerida(contractes);
  if (iFerida < 0) {
    ESTAT_CONTE.avisos.push('Cap escena no porta escena_ferida: la ferida del protagonista quedarà en mencions repartides. Marca\'n una a P3 o regenera l\'escaleta.');
  } else if (iFerida === contractes.length - 1) {
    ESTAT_CONTE.avisos.push(`L'escena de la ferida és l'última, la mateixa que executa el final. Es resoldran alhora i la ferida hi perdrà. Marca'n una altra a P3.`);
  }

  ESTAT_CONTE.escaleta = { escenes: contractes, justificacio_nombre: justificacio };
  ESTAT_CONTE.escenes_text = new Array(contractes.length).fill('');
  ESTAT_CONTE.text_conte = '';
}

// Marca UNA escena com a escena de la ferida i desmarca la resta: la ferida
// necessita una escena, no un tema repartit per tot el conte.
function marcarEscenaFerida(i) {
  const escenes = ESTAT_CONTE.escaleta.escenes;
  if (!escenes[i]) return;
  const jaHiEra = escenes[i].escena_ferida === true;
  escenes.forEach(e => { e.escena_ferida = false; });
  escenes[i].escena_ferida = !jaHiEra;
  desarEstat();
  renderitzar();
}

function reassignarFuncioPKD(i, funcio) {
  const e = ESTAT_CONTE.escaleta.escenes[i];
  if (!e) return;
  e.funcio_pkd = funcio;
  desarEstat();
  renderitzar();
}

// ═══════════════════════════════════════════════════════════
//  P4 — REDACCIÓ
// ═══════════════════════════════════════════════════════════

function resumEscena(i) {
  const c = ESTAT_CONTE.escaleta.escenes[i];
  if (!c) return '';
  return `Escena ${i + 1} (${c.lloc}): ${c.objectiu_pov} — obstacle: ${c.obstacle} — conseqüència: ${c.consequencia}`;
}

// Quins problemes quotidians toquen a cada escena, decidit per CODI i no pel
// model: tres aparicions repartides —principi, mig i final— i alternant els dos
// problemes, perquè apareguin tots dos. Si es deixés a criteri del model,
// s'acumularien a la primera escena i desapareixerien.
function sorollQuotidiaDeLEscena(i, total) {
  const quotidians = ((ESTAT_CONTE.dossier.protagonista || {}).problemes_quotidians || [])
    .filter(NUCLI.esTextUtil);
  if (quotidians.length === 0 || total < 1) return '';

  const punts = [0, Math.round((total - 1) / 2), total - 1].filter((v, k, a) => a.indexOf(v) === k);
  const posicio = punts.indexOf(i);
  if (posicio < 0) return '';

  return `SOROLL DE FONS OBLIGATORI EN AQUESTA ESCENA: «${quotidians[posicio % quotidians.length]}».
Ha d'aparèixer una vegada, de gairell, enmig d'una altra cosa: una trucada que talla, un paper que li recorda, una molèstia física mentre parla d'una altra cosa.
PROHIBIT resoldre'l, PROHIBIT connectar-lo amb l'anomalia i PROHIBIT que el protagonista se n'aturi a pensar. Entra, molesta i es queda igual que estava.`;
}

function promptEscena(i) {
  const escenes = ESTAT_CONTE.escaleta.escenes;
  const c = escenes[i];
  const total = escenes.length;
  const esPrimera = i === 0;
  const esUltima = i === total - 1;

  const escrit = ESTAT_CONTE.escenes_text.slice(0, i).filter(Boolean).join(NUCLI.SEPARADOR_ESCENA);
  const cua = escrit ? escrit.slice(-400) : '';

  const parts = [
    `ESCENA ${i + 1} DE ${total}.`,
    'DOSSIER DEL CONTE:\n' + JSON.stringify(ESTAT_CONTE.dossier, null, 2),
    'CONTRACTE D\'AQUESTA ESCENA:\n' + JSON.stringify(c, null, 2)
  ];

  if (i > 0) {
    parts.push('ESCENES JA ESCRITES (una línia cadascuna, per no repetir-les):\n' +
      escenes.slice(0, i).map((_, k) => resumEscena(k)).join('\n'));
  }
  if (cua) {
    parts.push('ÚLTIMS CARÀCTERS DEL TEXT JA ESCRIT (continua-hi des d\'aquí, sense repetir-los):\n«…' + cua + '»');
  }

  parts.push(`REGLES D'AQUESTA ESCENA:
- Objectiu de longitud: ${c.caracters_objectiu} CARÀCTERS amb espais. No comptis paraules: compta caràcters.
- Escriu NOMÉS aquesta escena. No resumeixis, no anticipis escenes futures${esUltima ? '' : ', i no tanquis el conte'}.
- Diàleg amb guió llarg (—) a principi de paràgraf. Aquest format és únic a tot el conte: mai cometes per marcar qui parla.
- Cap paraula en anglès ni en castellà.
- Cap etiqueta d'emoció genèrica: l'estat intern es llegeix en el cos, l'objecte, la rutina i el que el personatge deixa de fer. El narrador sí que pot nomenar el que sent el protagonista, però el personatge ha de desconfiar de la pròpia emoció i preguntar-se si és seva o si l'hi han posat.
- Les tres exigències de variació de registre —una frase llarga amb subordinació encadenada, dos passatges d'estil indirecte lliure i una digressió que no fa avançar la trama— s'apliquen a AQUESTA escena, no al conte en conjunt.
- Si aquí hi ha una acció que provoca un efecte, escriu la cadena sencera: què toca què, per on passa i per què això dona allò. La física pot ser inventada; el que no pot ser és que l'efecte passi perquè convé. El lector ha de poder seguir-la pas a pas.
- No escriguis el títol, ni el número d'escena, ni cap comentari fora de la ficció. Comença directament amb la primera frase de la narració.`);

  const soroll = sorollQuotidiaDeLEscena(i, total);
  if (soroll) parts.push(soroll);

  if (c.escena_ferida === true) {
    parts.push(blocConte(perfilActual(), 'nucli_emocional'));
    parts.push(`AQUESTA ÉS L'ESCENA DE LA FERIDA: "${ESTAT_CONTE.dossier.protagonista.ferida}".
Ocupa-hi espai. La ferida és la matèria d'aquesta escena, no un apunt dins d'una altra cosa: hi ha una gestió, un objecte o algú altre a l'habitació a través del qual es fa present.
PROHIBIT liquidar-la amb una frase de revelació. PROHIBIT tancar-la, entendre-la o perdonar-la.`);
  }

  parts.push(blocMotiusVetats({ compacte: true }));

  if (esPrimera) parts.push(blocOberturaConte(perfilActual()));
  if (esUltima) {
    parts.push(blocDesenllacConte(perfilActual()));
    parts.push(`Aquesta escena ha d'executar exactament el final obligatori: "${ESTAT_CONTE.dossier.final_obligatori}".
L'última frase NO pot ser una revelació que reordeni el conte. Ha de ser petita: un gest, un tràmit, una frase de feina. El lector ha de tancar el conte amb el marc trencat i sense que ningú l'hi hagi explicat.`);
  }

  return parts.join('\n\n');
}

async function escriureEscena(i) {
  const c = ESTAT_CONTE.escaleta.escenes[i];
  if (!c) throw new Error(`No hi ha contracte per a l'escena ${i + 1}.`);

  // maxTokens es deriva del pressupost de l'escena, NO de la longitud del
  // conte: cap crida demana mai una sortida que creixi amb el text acumulat.
  const maxTokens = Math.round(c.caracters_objectiu / 2.6) + 400;

  const r = await cridarText('escena',
    blocSistemaGeneracio({ prosa: true, forma: true, excellencia: true }),
    promptEscena(i), maxTokens);

  ESTAT_CONTE.escenes_text[i] = netejarTextEscena(r.text);
  compensarPressupost(i);
  ESTAT_CONTE.text_conte = '';
}

// El model de tant en tant hi posa el número d'escena o un títol malgrat la
// prohibició. Es retalla per codi, sense gastar cap crida a demanar-ho.
function netejarTextEscena(text) {
  return String(text || '')
    .replace(/^\s*(#+\s*)?(escena|capítol)\s*\d+\s*[:.\-—]?\s*$/gim, '')
    .replace(/^\s*—{3,}\s*$/gm, '')
    .trim();
}

// Compensació per codi: si una escena arriba curta o llarga, el dèficit o
// l'excés es reparteix entre les escenes que queden. Zero crides addicionals i
// cap regeneració.
function compensarPressupost(iEscrita) {
  const escenes = ESTAT_CONTE.escaleta.escenes;
  const c = escenes[iEscrita];
  if (!c) return;

  const reals = NUCLI.comptaCaracters(ESTAT_CONTE.escenes_text[iEscrita]);
  const desviacio = c.caracters_objectiu > 0 ? Math.abs(reals - c.caracters_objectiu) / c.caracters_objectiu : 0;
  if (desviacio > NUCLI.TOLERANCIA_ESCENA) {
    ESTAT_CONTE.avisos.push(`Escena ${iEscrita + 1}: ${num(reals)} caràcters sobre ${num(c.caracters_objectiu)} d'objectiu (${Math.round(desviacio * 100)}%). El desajust s'ha repartit entre les escenes que queden; no es regenera res.`);
  }

  const pendents = [];
  for (let k = iEscrita + 1; k < escenes.length; k++) pendents.push(k);
  if (pendents.length === 0) return;

  const escritsFinsAra = escenes.slice(0, iEscrita + 1)
    .reduce((a, _, k) => a + NUCLI.comptaCaracters(ESTAT_CONTE.escenes_text[k]), 0);
  const restant = Math.max(pendents.length * 600, NUCLI.CONTE_OBJECTIU_CARACTERS - escritsFinsAra);

  const pesos = NUCLI.pesosPerEscenes(pendents.map(k => escenes[k]));
  const nou = NUCLI.repartirCaracters(restant, pendents.length, pesos);
  pendents.forEach((k, j) => { escenes[k].caracters_objectiu = nou[j]; });
}

// ═══════════════════════════════════════════════════════════
//  P5 — COSTURA PER PEDAÇOS
// ═══════════════════════════════════════════════════════════

function promptCosturaEstil(text) {
  return [
    'CONTE SENCER:\n\n' + text,
    `Troba fins a 12 punts concrets a millorar: repeticions literals, tics, adverbis en -ment acumulats, frases que expliquen una emoció en lloc de mostrar-la, informació repetida entre escenes.

Per a cadascun retorna un objecte { "cerca", "substitueix", "motiu" }.

REGLES ABSOLUTES SOBRE 'cerca':
- Ha de ser un fragment LITERAL i ÚNIC del text de dalt, copiat caràcter a caràcter.
- Entre 20 i 200 caràcters. Ha de ser una frase sencera acabada en punt sempre que es pugui.
- Si dubtes que sigui únic, allarga'l fins que ho sigui.
- Si no pots copiar-lo literalment, no proposis el pedaç.

REGLES SOBRE 'substitueix':
- No canviïs cap fet, cap nom, cap xifra ni cap data.
- Ha de tenir una longitud semblant a 'cerca'.
- No toquis l'última frase del conte.`,
    blocCriterisLlengua(),
    `NO proposis cap pedaç per aquests motius, que són de generació i no de correcció: la premissa, el registre de la prosa, la profunditat del personatge o l'estructura del conte. Si el problema és d'aquests, el conte s'ha de tornar a generar, no apedaçar.
Un pedaç d'estil que uniformitza la longitud de les frases és un defecte: la variació de període és deliberada. No retallis les frases llargues subordinades, ni els passatges d'estil indirecte lliure, ni les digressions.`,
    'Format: JSON estricte { "pedacos": [...] }. Res més.'
  ].join('\n\n');
}

function promptCosturaLongitud(text, diferencia) {
  const curt = diferencia > 0;
  const cites = citesPerAjustar(text, curt);
  return [
    'CONTE SENCER:\n\n' + text,
    curt
      ? `Al conte li falten exactament ${diferencia} caràcters per arribar al mínim de ${NUCLI.CONTE_MIN_CARACTERS}.
Amplia 2 o 3 moments concrets amb pedaços de motiu "expansio". Amplia aquests punts i cap altre:
${cites.map((c, i) => `${i + 1}. «${c}»`).join('\n')}`
      : `Al conte li sobren exactament ${-diferencia} caràcters per sota del màxim de ${NUCLI.CONTE_MAX_CARACTERS}.
Retalla els fragments més expansius amb pedaços de motiu "retall". Retalla aquests punts i cap altre:
${cites.map((c, i) => `${i + 1}. «${c}»`).join('\n')}`,
    `El camp 'cerca' de cada pedaç ha de ser un fragment LITERAL i ÚNIC del text, copiat caràcter a caràcter.
No canviïs cap fet, cap nom, cap xifra ni cap data. No toquis l'última frase del conte.
El motiu ha de ser exactament "${curt ? 'expansio' : 'retall'}".`,
    'Format: JSON estricte { "pedacos": [...] }. Res més.'
  ].join('\n\n');
}

// Tria per codi 3 paràgrafs candidats: els més llargs si cal retallar, els més
// curts si cal ampliar. Es passen com a cita literal perquè el model no hagi
// d'endevinar on tocar.
function citesPerAjustar(text, ampliar) {
  const paragrafs = String(text).split(/\n\s*\n/).map(p => p.trim()).filter(p => p.length > 120);
  const ordenats = paragrafs.slice().sort((a, b) => ampliar ? a.length - b.length : b.length - a.length);
  return ordenats.slice(0, 3).map(p => NUCLI.retallarParaules(p, 14));
}

async function costuraEstil() {
  const text = textActual();
  const r = await cridarJSON('costura', blocSistemaGeneracio({ corrector: true, forma: false }),
    promptCosturaEstil(text), 3500, ['pedacos']);
  return aplicarLotDePedacos(text, r.dades.pedacos, 'costura d\'estil');
}

async function costuraLongitud() {
  const text = textActual();
  const caracters = NUCLI.comptaCaracters(text);
  let diferencia = 0;
  if (caracters < NUCLI.CONTE_MIN_CARACTERS) diferencia = NUCLI.CONTE_MIN_CARACTERS - caracters + 400;
  else if (caracters > NUCLI.CONTE_MAX_CARACTERS) diferencia = NUCLI.CONTE_MAX_CARACTERS - caracters - 400;
  if (diferencia === 0) return null;

  const r = await cridarJSON('costura', blocSistemaGeneracio({ corrector: true, forma: false }),
    promptCosturaLongitud(text, diferencia), 3500, ['pedacos']);
  return aplicarLotDePedacos(text, r.dades.pedacos, 'ajust de longitud');
}

// L'ÚNIC embut per on passa qualsevol edició feta pel model. Per això la
// validació de coherència global es crida aquí i no a cada pas: qualsevol camí
// que apedaci el text hi passa per força, i cap camí nou se la pot saltar sense
// saltar-se també aplicarPedacos.
function aplicarLotDePedacos(text, pedacos, origen) {
  const resultat = NUCLI.aplicarPedacos(text, Array.isArray(pedacos) ? pedacos : []);
  ESTAT_CONTE.text_conte = resultat.text;
  ESTAT_CONTE.pedacos_rebutjats = ESTAT_CONTE.pedacos_rebutjats.concat(
    resultat.rebutjats.map(r => ({ cerca: (r.pedac && r.pedac.cerca) || '', motiu_rebuig: r.motiu, motiu_pedac: (r.pedac && r.pedac.motiu) || '' })));

  executarCoherencia({
    textAnterior: text,
    pedacos: resultat.aplicats,
    origen: origen || 'pedaç',
    pedacos_aplicats: resultat.aplicats.length,
    pedacos_rebutjats: resultat.rebutjats.length
  });
  return resultat;
}

// La passada de coherència mira el text SENCER, no el fragment editat, i costa
// zero tokens. S'executa després de tota edició, també de les que ha generat el
// mateix model, perquè els destrosses documentats van ser exactament això:
// pedaços correctes que trencaven el text que no tocaven.
function executarCoherencia(context) {
  const ctx = context || {};
  const informe = NUCLI.validarCoherenciaGlobal(textActual(), {
    textAnterior: ctx.textAnterior,
    pedacos: ctx.pedacos,
    dossier: ESTAT_CONTE.dossier,
    escaleta: ESTAT_CONTE.escaleta.escenes,
    origen: ctx.origen
  });
  informe.pedacos_aplicats = Number(ctx.pedacos_aplicats) || 0;
  informe.pedacos_rebutjats_al_lot = Number(ctx.pedacos_rebutjats) || 0;
  ESTAT_CONTE.coherencia = informe;
  desarEstat();
  return informe;
}

// Edició a mà: també és una edició, i també passa per la validació. Aquí no hi
// ha llista de pedaços, així que les dues comprovacions que necessiten saber
// què s'ha canviat es declaren no executades en lloc de donar-se per bones.
function editarTextAMa(nou) {
  const anterior = textActual();
  ESTAT_CONTE.text_conte = String(nou == null ? '' : nou);
  executarAuditoria();
  executarCoherencia({ textAnterior: anterior, pedacos: [], origen: 'edició a mà' });
  renderitzar();
}

// ═══════════════════════════════════════════════════════════
//  P6 — AUDITORIA DETERMINISTA (zero crides)
// ═══════════════════════════════════════════════════════════

function executarAuditoria() {
  const text = textActual();
  ESTAT_CONTE.auditoria = NUCLI.auditoriaDeterministaConte(text, ESTAT_CONTE.escaleta.escenes, ESTAT_CONTE.dossier);
  ESTAT_CONTE.auditoria.moment = new Date().toISOString();
  desarEstat();
}

// ═══════════════════════════════════════════════════════════
//  P7 — LECTURA HOSTIL
// ═══════════════════════════════════════════════════════════

function promptLectura(text) {
  return [
    'CONTE SENCER:\n\n' + text,
    `Troba els CINC defectes més greus d'aquest conte. Per a cadascun:
- "cita": un fragment LITERAL del text, copiat caràcter a caràcter, que mostri el defecte.
- "per_que": una sola frase que digui per què és un defecte.
Un defecte sense cita literal no serveix: no el proposis.`,
    `Respon també les quatre preguntes de la porta, amb SI o NO i amb una cita literal del text que sostingui la resposta:
- esquerda: hi ha una esquerda de realitat que NO es recompon?
- mentida: el sistema menteix d'una manera comprovable dins del text?
- paranoia: la paranoia del protagonista té base verificable dins del text?
- empatia: hi ha una decisió on l'empatia li costa alguna cosa concreta?`,
    'PROHIBIT: posar nota, resumir el conte, elogiar res.',
    'Format: JSON estricte { "defectes": [ {"cita","per_que"} ], "porta_pkd": { "esquerda": {"resposta","cita"}, "mentida": {...}, "paranoia": {...}, "empatia": {...} } }. Res més.'
  ].join('\n\n');
}

async function lecturaHostil() {
  const text = textActual();
  const tria = CLIENT.triarModelPerPas('lectura', ESTAT_CONTE.config);
  ESTAT_CONTE.lectura_avis_model = tria.avis || '';

  const r = await cridarJSON('lectura', blocSistemaLectura(), promptLectura(text), 3000, ['defectes']);

  const bruts = Array.isArray(r.dades.defectes) ? r.dades.defectes : [];
  const acceptats = [];
  const descartats = [];
  bruts.forEach(d => {
    const cita = String((d && d.cita) || '').trim();
    if (!cita) { descartats.push({ per_que: (d && d.per_que) || '(sense explicació)', motiu: 'ha arribat sense cita literal' }); return; }
    if (text.indexOf(cita) < 0) { descartats.push({ per_que: (d && d.per_que) || '', cita, motiu: 'la cita no apareix literalment al text' }); return; }
    acceptats.push({ cita, per_que: String((d && d.per_que) || '').trim(), triat: false });
  });

  ESTAT_CONTE.lectura = {
    model: tria.model,
    mateix_model_que_prosa: tria.mateix_model_que_prosa,
    defectes: acceptats,
    descartats,
    porta_pkd: r.dades.porta_pkd || null,
    moment: new Date().toISOString()
  };
}

function promptPedacDirigit(text, defectes) {
  return [
    'PEDAÇOS DIRIGITS.',
    'CONTE SENCER:\n\n' + text,
    'DEFECTES QUE HAS DE CORREGIR I CAP ALTRE:\n' +
      defectes.map((d, i) => `${i + 1}. «${d.cita}»\n   Problema: ${d.per_que}`).join('\n'),
    `Per a cada defecte retorna un objecte { "cerca", "substitueix", "motiu" }.
- 'cerca' ha de ser un fragment LITERAL i ÚNIC del text, copiat caràcter a caràcter.
- 'substitueix' ha de tenir una longitud semblant.
- No canviïs cap fet, cap nom, cap xifra ni cap data. No toquis l'última frase del conte.`,
    `CADA PEDAÇ ES LLEGEIX SOBRE EL CONTE SENCER, NO SOBRE EL FRAGMENT.
- Si canvies una paraula que apareix més vegades al text —una classificació impresa, el nom d'un imprès, una fórmula administrativa—, comprova abans totes les altres aparicions. Canviar «HABITATGE» per «FITXA ACTIVA» deixa quatre línies més avall una frase que parla de la paraula «habitatge» que ja no hi és.
- Si esborres una opció, una dada o una alternativa, esborra també la clàusula que la justificava. Una justificació sense allò que justificava queda òrfena i el lector la llegeix com un error.
- No deixis mai dues frases idèntiques seguides: comprova que 'substitueix' no repeteix el que ja diu la frase anterior o la següent.`,
    blocCriterisLlengua(),
    'Format: JSON estricte { "pedacos": [...] }. Res més.'
  ].join('\n\n');
}

async function aplicarPedacDirigit() {
  const triats = (ESTAT_CONTE.lectura.defectes || []).filter(d => d.triat);
  if (triats.length === 0) throw new Error('No has triat cap defecte per corregir.');

  const text = textActual();
  const r = await cridarJSON('pedac', blocSistemaGeneracio({ corrector: true, forma: false }),
    promptPedacDirigit(text, triats), 3000, ['pedacos']);

  const resultat = aplicarLotDePedacos(text, r.dades.pedacos, 'pedaç dirigit');
  ESTAT_CONTE.rondes_pedac += 1;
  triats.forEach(d => { d.triat = false; d.corregit = true; });
  executarAuditoria();
  return resultat;
}

function baixar(nom, contingut, tipus) {
  const blob = new Blob([contingut], { type: tipus || 'text/plain;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = nom;
  document.body.appendChild(a); a.click();
  document.body.removeChild(a);
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}

function nomFitxer(extensio) {
  const base = (ESTAT_CONTE.titol || 'conte').toLowerCase()
    .normalize('NFD').replace(/[̀-ͯ]/g, '')
    .replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '').slice(0, 50) || 'conte';
  return `${base}.${extensio}`;
}

function cosDelConte() {
  // El títol NO s'insereix mai al cos si l'usuari no ho ha decidit.
  const cos = textActual();
  return ESTAT_CONTE.titol_al_cos && ESTAT_CONTE.titol ? `${ESTAT_CONTE.titol}\n\n${cos}` : cos;
}

function exportarTXT() { baixar(nomFitxer('txt'), cosDelConte()); }

function exportarMD() {
  const m = metadadesConte();
  const md = [
    cosDelConte(),
    '\n\n---\n',
    '## Metadades\n',
    '```json',
    JSON.stringify(m, null, 2),
    '```'
  ].join('\n');
  baixar(nomFitxer('md'), md, 'text/markdown;charset=utf-8');
}

function exportarMetadades() {
  baixar(nomFitxer('metadades.json'), JSON.stringify(metadadesConte(), null, 2), 'application/json;charset=utf-8');
}

function exportarProjecte() {
  const projecte = JSON.parse(JSON.stringify(ESTAT_CONTE));
  delete projecte.config.claus; // mai s'exporten les claus API
  projecte.comptador = JSON.parse(JSON.stringify(CLIENT.comptador));
  baixar(nomFitxer('projecte.json'), JSON.stringify(projecte, null, 2), 'application/json;charset=utf-8');
}

function importarProjecte(fitxer) {
  const lector = new FileReader();
  lector.onload = () => {
    try {
      const dades = JSON.parse(lector.result);
      const claus = ESTAT_CONTE.config.claus;
      ESTAT_CONTE = migrarEstat(dades);
      ESTAT_CONTE.config.claus = claus;
      if (dades.comptador) CLIENT.restaurarComptador(dades.comptador);
      desarEstat();
      renderitzar();
    } catch (e) {
      alert('El fitxer de projecte no es pot llegir: ' + (e && e.message));
    }
  };
  lector.readAsText(fitxer);
}

function avancarFins(pas) {
  ESTAT_CONTE.pas_actual = Math.max(ESTAT_CONTE.pas_actual, pas);
  ESTAT_CONTE.pas_obert = pas;
  desarEstat();
  renderitzar();
  // Tota transició de pas deixa la vista al destí.
  requestAnimationFrame(() => {
    const el = document.getElementById('pas-' + pas);
    if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' });
  });
}

function obrirPas(pas) {
  ESTAT_CONTE.pas_obert = (ESTAT_CONTE.pas_obert === pas) ? -1 : pas;
  desarEstat();
  renderitzar();
}

// Envoltori únic de tota acció asíncrona: gestiona l'indicador de càrrega, els
// errors i el desat. Cap acció pot quedar penjada sense dir res.
async function accio(idBoto, feina) {
  const boto = document.getElementById(idBoto);
  const carregant = boto ? boto.parentElement.querySelector('.carregant') : null;
  if (boto) boto.disabled = true;
  if (carregant) carregant.classList.add('visible');
  try {
    await feina();
    ESTAT_CONTE.avisos = ESTAT_CONTE.avisos.slice(-8);
  } catch (e) {
    const missatge = (e && e.message) || String(e);
    ESTAT_CONTE.avisos.push(missatge);
    // Els sostres de pas i el pressupost esgotat són resultats PREVISTOS del
    // disseny, no fallades: es mostren a la interfície i es registren com a
    // informació. Només el que no s'esperava va a console.error.
    if (e && (e.esLimitPas || e.esSostreCrides)) console.info('[pressupost]', missatge);
    else console.error(e);
  } finally {
    if (carregant) carregant.classList.remove('visible');
    desarEstat();
    renderitzar();
  }
}

function renderitzarProgres() {
  const text = textActual();
  const caracters = NUCLI.comptaCaracters(text);
  const c = CLIENT.comptador;
  const sostre = CLIENT.sostreCrides();

  document.getElementById('pr-pas').textContent = NOMS_PAS[ESTAT_CONTE.pas_actual] || NOMS_PAS[0];
  document.getElementById('pr-caracters').textContent = `${num(caracters)} / ${num(NUCLI.CONTE_OBJECTIU_CARACTERS)}`;

  const crides = document.getElementById('pr-crides');
  crides.textContent = `${c.crides} / ${sostre}` + (c.represes ? ` (${c.represes} represa${c.represes > 1 ? 'es' : ''})` : '');
  crides.className = 'valor' + (c.crides >= sostre ? ' perill' : c.crides >= sostre * 0.75 ? ' alerta' : '');

  document.getElementById('pr-estimat').textContent = ESTAT_CONTE.estimacio
    ? usd(ESTAT_CONTE.estimacio.cost_usd) + ' (est.)' : '—';
  document.getElementById('pr-real').textContent = usd(c.cost_estimat_usd);

  const pct = Math.min(100, Math.round((caracters / NUCLI.CONTE_OBJECTIU_CARACTERS) * 100));
  document.getElementById('pr-barra').style.width = pct + '%';

  document.getElementById('pastilla-demo').hidden = !ESTAT_CONTE.config.demo;
}

function targeta(pas, titol, estat, classeEstat, cos) {
  const obert = ESTAT_CONTE.pas_obert === pas;
  const fet = ESTAT_CONTE.pas_actual > pas;
  const actiu = ESTAT_CONTE.pas_actual === pas;
  return `<section class="targeta ${obert ? '' : 'plegat'} ${fet ? 'fet' : ''} ${actiu ? 'actiu' : ''}" id="pas-${pas}">
    <div class="targeta-cap" onclick="obrirPas(${pas})">
      <span class="pas-num">${pas}</span>
      <h2>${esc(titol)}</h2>
      <span class="estat-pas ${classeEstat || ''}">${esc(estat)}</span>
    </div>
    <div class="targeta-cos">${cos}</div>
  </section>`;
}

  return `<div class="blocatge">
