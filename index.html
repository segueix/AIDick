    triada !== null ? 'ok' : (llavors.length ? 'avis' : ''), `
    ${motius ? `<p class="ajuda">Motius d'aquest conte: ${motius}</p>` : ''}
    ${llista || '<p class="ajuda">Una crida al model proposa sis llavors amb premissa, esquerda, mentida del sistema, final obligatori, protagonista i cost de l\'empatia.</p>'}
    ${bloc}
    <div class="accions">
      <button class="primari" id="b-llavors" onclick="accio('b-llavors', generarLlavors)">${llavors.length ? 'Regenera les llavors' : 'Genera sis llavors'} <span style="opacity:.7">· 1 crida</span></button>
      ${carregantHTML()}
    </div>
  `);
}

// ── P2 ────────────────────────────────────────────────────
function renderP2() {
  const d = ESTAT_CONTE.dossier;
  const v = NUCLI.validarDossier(d);
  const mida = new Blob([JSON.stringify(d)]).size;

  const blocatges = v.faltants.map(f => blocatge(f.motiu, f.camp,
    `<button class="resolucio petit" onclick="accio('b-dossier-omplir', resoldreFaltantsDossier)">${esc(f.com_resoldre)}</button>`)).join('');

  const resum = ESTAT_CONTE.dossier_generat ? `
    <table class="metrica">
      <tr><th>Camp</th><th>Contingut</th></tr>
      <tr><td>Anomalia única</td><td>${esc(d.anomalia) || '<span style="color:var(--vermell)">falta</span>'}</td></tr>
      <tr><td>Protagonista</td><td>${esc(d.protagonista.nom)} — ${esc(d.protagonista.feina_ordinaria)}</td></tr>
      <tr><td>Ferida</td><td>${esc(d.protagonista.ferida)}</td></tr>
      <tr><td>Soroll de fons</td><td>${(d.protagonista.problemes_quotidians || []).map(q => esc(q)).join('<br>') || '<span style="color:var(--vermell)">falten</span>'}</td></tr>
      <tr><td>Món</td><td>${esc(d.mon.lloc)} · ${esc(d.mon.any)}</td></tr>
      <tr><td>Secundaris</td><td>${(d.secundaris || []).map(s => esc(s.nom)).join(', ') || '—'}</td></tr>
      <tr><td>Fets canònics</td><td>${(d.fets_canonics || []).length}</td></tr>
      <tr><td>Cronologia</td><td>${(d.cronologia || []).length} fites</td></tr>
      <tr><td>Frases que no diria</td><td>${((d.protagonista.veu || {}).mai_diria || []).length}</td></tr>
      <tr><td>Cost del dossier per escena</td><td>≈ ${num(Math.round(mida / 3.5))} tokens d'entrada, un cop per escena</td></tr>
      <tr><td>Mida serialitzada</td><td>${num(mida)} bytes ${
        mida < 3072 ? '<span style="color:var(--verd)">(compacte)</span>'
        : mida < 4096 ? '<span style="color:var(--groc)">(acceptable: l\'esquema ple hi arriba)</span>'
        : '<span style="color:var(--vermell)">(infla totes les crides d\'escena)</span>'}</td></tr>
    </table>
    <details style="margin-top:.7rem"><summary style="cursor:pointer;font-size:.85rem;color:var(--text2)">Dossier sencer (editable)</summary>
      <textarea rows="14" style="margin-top:.5rem;font-family:ui-monospace,monospace;font-size:.78rem"
        onchange="editarDossier(this.value)">${esc(JSON.stringify(d, null, 2))}</textarea>
    </details>` : '<p class="ajuda">Una crida converteix la llavor triada en el dossier: personatges, món, objectes, fets canònics i cronologia. És l\'única font de veritat narrativa del conte i cap altre pas n\'inventa res.</p>';

  return targeta(2, 'Dossier', v.valid ? 'complet' : (ESTAT_CONTE.dossier_generat ? `${v.faltants.length} camps a resoldre` : 'pendent'),
    v.valid ? 'ok' : (ESTAT_CONTE.dossier_generat ? 'avis' : ''), `
    ${resum}
    ${blocatges}
    <div class="accions">
      <button class="primari" id="b-dossier" onclick="accio('b-dossier', generarDossier)"
        ${ESTAT_CONTE.llavor_triada === null ? 'disabled' : ''}>${ESTAT_CONTE.dossier_generat ? 'Regenera el dossier' : 'Genera el dossier'} <span style="opacity:.7">· 1 crida</span></button>
      ${v.valid ? `<button onclick="avancarFins(3)">Continua a l'escaleta</button>` : ''}
      <button id="b-dossier-omplir" style="display:none"></button>
      ${carregantHTML()}
    </div>
    ${ESTAT_CONTE.llavor_triada === null ? '<div class="nota">Primer cal triar una llavor a P1.</div>' : ''}
  `);
}

// Resolució de faltants: primer LOCAL i determinista, i només si això no
// n'arregla cap, UNA crida de compleció que demana únicament el que falta.
async function resoldreFaltantsDossier() {
  const omplertsLocalment = completarDossierLocalment();
  let v = NUCLI.validarDossier(ESTAT_CONTE.dossier);

  if (omplertsLocalment.length) {
    ESTAT_CONTE.avisos.push(`S'han omplert en local, sense cap crida: ${omplertsLocalment.join(', ')}.`);
  }
  if (v.valid) return;

  if (ESTAT_CONTE.dossier_complecions >= 1) {
    ESTAT_CONTE.avisos.push('Ja s\'ha gastat la crida de compleció d\'aquest dossier. Els camps que queden s\'han d\'omplir a mà al dossier editable.');
    return;
  }
  await completarDossierAmbModel(v.faltants);
  v = NUCLI.validarDossier(ESTAT_CONTE.dossier);
  if (!v.valid) {
    ESTAT_CONTE.avisos.push(`Després de la compleció encara falten: ${v.faltants.map(f => f.camp).join(', ')}. Edita'ls a mà al dossier.`);
  }
}

function editarDossier(text) {
  try {
    const nou = JSON.parse(text);
    ESTAT_CONTE.dossier = NUCLI.fusionarDossierSenseBuidar(NUCLI.crearDossierBuit(), nou);
    desarEstat(); renderitzar();
  } catch (e) {
    ESTAT_CONTE.avisos.push('El dossier editat no és JSON vàlid: ' + (e && e.message));
    renderitzar();
  }
}

// ── P3 ────────────────────────────────────────────────────
function renderP3() {
  const escenes = ESTAT_CONTE.escaleta.escenes;
  const gate = NUCLI.validarGatePKD(escenes);
  const suma = escenes.reduce((a, e) => a + (e.caracters_objectiu || 0), 0);

  const fitxes = escenes.map((e, i) => `
    <div class="escena-fitxa">
      <div class="cap">
        <strong>Escena ${i + 1}</strong>
        <span class="marca-pkd ${esc(e.funcio_pkd)}">${esc(e.funcio_pkd)}</span>
        ${e.escena_ferida ? '<span class="pastilla" title="La ferida del protagonista és la matèria d\'aquesta escena">ferida</span>' : ''}
        <span style="color:var(--text3);font-size:.78rem">${num(e.caracters_objectiu)} caràcters</span>
        <button class="petit" style="width:auto;margin-left:auto;font-size:.72rem"
          onclick="marcarEscenaFerida(${i})">${e.escena_ferida ? 'Treu la ferida' : 'Escena de la ferida'}</button>
        <select class="petit" style="width:auto;font-size:.78rem"
          onchange="reassignarFuncioPKD(${i}, this.value)">
          ${NUCLI.FUNCIONS_PKD.map(f => `<option value="${f}" ${f === e.funcio_pkd ? 'selected' : ''}>funció: ${f}</option>`).join('')}
        </select>
      </div>
      <div class="camps">
        <div><b>Punt de vista</b>${esc(e.pov)}</div>
        <div><b>Lloc</b>${esc(e.lloc)}</div>
        <div><b>Objectiu</b>${esc(e.objectiu_pov)}</div>
        <div><b>Obstacle</b>${esc(e.obstacle)}</div>
        <div><b>En disputa</b>${esc(e.objecte_o_informacio_en_disputa)}</div>
        <div><b>Decisió irreversible</b>${esc(e.decisio_irreversible)}</div>
        <div><b>Cost immediat</b>${esc(e.cost_immediat)}</div>
        <div><b>Conseqüència</b>${esc(e.consequencia)}</div>
      </div>
      <details style="margin-top:.5rem"><summary style="cursor:pointer;font-size:.8rem;color:var(--text2)">Edita el contracte</summary>
        <textarea rows="10" style="margin-top:.4rem;font-family:ui-monospace,monospace;font-size:.76rem"
          onchange="editarContracte(${i}, this.value)">${esc(JSON.stringify(e, null, 2))}</textarea>
      </details>
    </div>`).join('');

  let blocatges = '';
  if (escenes.length && !gate.valid) {
    blocatges = gate.faltants.map(f => blocatge(
      `Porta PKD: falta la funció «${f.funcio}». ${f.motiu}`,
      'La porta l\'ha de tancar el model o una persona: el fallback local no pot assignar cap funció PKD per accident.',
      `<button class="resolucio petit" onclick="assignarFuncioAPrimeraLliure('${f.funcio}')">Assigna «${f.funcio}» a una escena</button>
       <button class="resolucio petit" onclick="accio('b-escaleta', generarEscaleta)">Regenera l'escaleta · 1 crida</button>`)).join('');
  }
  if (escenes.length && !gate.paranoia_present) {
    blocatges += `<div class="nota">${esc(gate.avis_paranoia)}</div>`;
  }
  const iFerida = NUCLI.indexEscenaFerida(escenes);
  if (escenes.length && iFerida < 0) {
    blocatges += blocatge(
      'Cap escena no és l\'escena de la ferida. La ferida del protagonista quedarà repartida en mencions, que és el defecte que aquesta marca serveix per evitar.',
      'Com la porta PKD, aquesta marca no la pot posar el fallback local: la posa el model o una persona.',
      `<button class="resolucio petit" onclick="marcarEscenaFerida(${Math.max(0, Math.min(1, escenes.length - 1))})">Marca l'escena ${Math.max(0, Math.min(1, escenes.length - 1)) + 1}</button>
       <button class="resolucio petit" onclick="accio('b-escaleta', generarEscaleta)">Regenera l'escaleta · 1 crida</button>`);
  } else if (escenes.length && iFerida === escenes.length - 1) {
    blocatges += `<div class="nota">L'escena de la ferida és l'última, la mateixa que executa el final: es resoldran alhora i la ferida hi perdrà.</div>`;
  }

  return targeta(3, 'Escaleta i contractes',
    escenes.length ? (gate.valid ? `${escenes.length} escenes · porta PKD tancada` : 'porta PKD oberta') : 'pendent',
    escenes.length ? (gate.valid ? 'ok' : 'error') : '', `
    ${ESTAT_CONTE.escaleta.justificacio_nombre ? `<p class="ajuda"><b>Per què ${escenes.length} escenes:</b> ${esc(ESTAT_CONTE.escaleta.justificacio_nombre)}</p>` : ''}
    ${escenes.length ? `<p class="ajuda">Pressupost repartit: <b>${num(suma)}</b> caràcters ${suma === NUCLI.CONTE_OBJECTIU_CARACTERS ? '<span style="color:var(--verd)">(quadra amb l\'objectiu)</span>' : '<span style="color:var(--groc)">(no quadra amb l\'objectiu)</span>'}. Editar aquí no costa cap token; editar després del pas 4 costa el conte sencer.</p>` : '<p class="ajuda">Una crida proposa de 4 a 6 escenes amb contracte complet. Els forats del contracte es tapen en local; la porta PKD, no.</p>'}
    ${fitxes}
    ${blocatges}
    <div class="accions">
      <button class="primari" id="b-escaleta" onclick="accio('b-escaleta', generarEscaleta)"
        ${NUCLI.validarDossier(ESTAT_CONTE.dossier).valid ? '' : 'disabled'}>${escenes.length ? 'Regenera l\'escaleta' : 'Genera l\'escaleta'} <span style="opacity:.7">· 1 crida</span></button>
      ${escenes.length && gate.valid ? `<button onclick="avancarFins(4)">Continua a la redacció</button>` : ''}
      ${carregantHTML()}
    </div>
    ${NUCLI.validarDossier(ESTAT_CONTE.dossier).valid ? '' : '<div class="nota">El dossier de P2 encara té camps per resoldre.</div>'}
  `);
}

function assignarFuncioAPrimeraLliure(funcio) {
  const escenes = ESTAT_CONTE.escaleta.escenes;
  let i = escenes.findIndex(e => e.funcio_pkd === 'cap');
  if (i < 0) i = escenes.findIndex(e => NUCLI.FUNCIONS_PKD_OBLIGATORIES.indexOf(e.funcio_pkd) < 0);
  if (i < 0) i = 0;
  reassignarFuncioPKD(i, funcio);
}

function editarContracte(i, text) {
  try {
    const nou = JSON.parse(text);
    const { contracte } = NUCLI.completarContracteAmbFallback(
      Object.assign({}, nou, { index: i }), ESTAT_CONTE.dossier, nou.caracters_objectiu);
    ESTAT_CONTE.escaleta.escenes[i] = contracte;
    desarEstat(); renderitzar();
  } catch (e) {
    ESTAT_CONTE.avisos.push(`El contracte de l'escena ${i + 1} no és JSON vàlid: ` + (e && e.message));
    renderitzar();
  }
}

// ── P4 ────────────────────────────────────────────────────
function renderP4() {
  const escenes = ESTAT_CONTE.escaleta.escenes;
  const escrites = ESTAT_CONTE.escenes_text.filter(t => String(t || '').trim()).length;
  const seguent = ESTAT_CONTE.escenes_text.findIndex((t, i) => i < escenes.length && !String(t || '').trim());
  const totes = escenes.length > 0 && escrites === escenes.length;

  const files = escenes.map((e, i) => {
    const t = ESTAT_CONTE.escenes_text[i] || '';
    const reals = NUCLI.comptaCaracters(t);
    const desv = e.caracters_objectiu ? (reals - e.caracters_objectiu) / e.caracters_objectiu : 0;
    return `<tr>
      <td>${i + 1} <span class="marca-pkd ${esc(e.funcio_pkd)}">${esc(e.funcio_pkd)}</span></td>
      <td class="num">${num(e.caracters_objectiu)}</td>
      <td class="num">${t ? num(reals) : '—'}</td>
      <td class="num" style="color:${!t ? 'var(--text3)' : Math.abs(desv) > NUCLI.TOLERANCIA_ESCENA ? 'var(--groc)' : 'var(--verd)'}">${t ? (desv >= 0 ? '+' : '') + Math.round(desv * 100) + '%' : '—'}</td>
      <td>${t ? '<span class="semafor verd"></span>escrita' : '<span class="semafor" style="background:var(--text3)"></span>pendent'}</td>
    </tr>`;
  }).join('');

  let bloc = '';
  if (escenes.length && !totes) {
    bloc = blocatge(`Falten ${escenes.length - escrites} escenes per escriure.`, `Una crida per escena, ni una més. No hi ha cap segona crida de refinament.`,
      `<button class="resolucio petit" onclick="accio('b-escena', escriureSeguent)">Escriu l'escena ${seguent + 1}</button>
       <button class="resolucio petit" onclick="accio('b-escena', escriureTotes)">Escriu-les totes seguides</button>`);
  }

  return targeta(4, 'Redacció per escenes', escenes.length ? `${escrites}/${escenes.length} escrites` : 'pendent',
    totes ? 'ok' : (escrites ? 'avis' : ''), `
    ${escenes.length ? `<table class="metrica">
      <tr><th>Escena</th><th>Objectiu</th><th>Reals</th><th>Desviació</th><th>Estat</th></tr>${files}</table>` : '<p class="ajuda">Primer cal l\'escaleta de P3.</p>'}
    <p class="ajuda">Cada crida rep el dossier, el contracte de la seva escena, un resum d'una línia de les anteriors i els últims 400 caràcters escrits. Res més: la mida de l'entrada no creix amb la longitud del conte.</p>
    ${bloc}
    <div class="accions">
      <button class="primari" id="b-escena" onclick="accio('b-escena', escriureSeguent)"
        ${!escenes.length || totes ? 'disabled' : ''}>Escriu l'escena ${Math.max(1, seguent + 1)} <span style="opacity:.7">· 1 crida</span></button>
      <button onclick="accio('b-escena', escriureTotes)" ${!escenes.length || totes ? 'disabled' : ''}>Escriu-les totes <span style="opacity:.7">· ${escenes.length - escrites} crides</span></button>
      ${totes ? `<button onclick="avancarFins(5)">Continua a la costura</button>` : ''}
      ${carregantHTML()}
    </div>
    ${escrites ? `<div class="lectura">${esc(textActual()).replace(/· · ·/g, '<span class="separador">· · ·</span>')}</div>` : ''}
  `);
}

async function escriureSeguent() {
  const escenes = ESTAT_CONTE.escaleta.escenes;
  const i = ESTAT_CONTE.escenes_text.findIndex((t, k) => k < escenes.length && !String(t || '').trim());
  if (i < 0) throw new Error('Totes les escenes ja estan escrites.');
  await escriureEscena(i);
  if (ESTAT_CONTE.escenes_text.filter(t => String(t || '').trim()).length === escenes.length) {
    ESTAT_CONTE.pas_actual = Math.max(ESTAT_CONTE.pas_actual, 5);
  }
}

async function escriureTotes() {
  const escenes = ESTAT_CONTE.escaleta.escenes;
  for (let i = 0; i < escenes.length; i++) {
    if (String(ESTAT_CONTE.escenes_text[i] || '').trim()) continue;
    await escriureEscena(i);
    renderitzarProgres();
  }
  ESTAT_CONTE.pas_actual = Math.max(ESTAT_CONTE.pas_actual, 5);
}

// Informe de coherència global. El mateix bloc es mostra a P5 i a P7, que són
// els dos passos on el text es pot editar: la validació és una sola i el que
// canvia és qui l'ha disparada.
function blocCoherencia() {
  const c = ESTAT_CONTE.coherencia;
  if (!c) {
    return `<p class="ajuda" style="margin-top:.8rem"><b>Coherència global:</b> encara no s'ha executat. S'executa sola després de cada edició —les del model i les fetes a mà— i mira el text sencer, no el fragment editat. Zero crides.</p>`;
  }

  const ordre = { alta: 0, mitjana: 1, baixa: 2 };
  const problemes = c.problemes.slice().sort((a, b) => (ordre[a.severitat] ?? 3) - (ordre[b.severitat] ?? 3));
  const altes = problemes.filter(p => p.severitat === 'alta').length;

  const files = c.comprovacions.map(x => `
    <tr>
      <td>${esc(x.nom)}<div style="color:var(--text3);font-size:.76rem">${esc(x.que_detecta)}</div></td>
      <td>${x.executada
        ? `<span class="semafor ${x.trobades ? (x.id === 'longitud' || x.id === 'referencies_trencades' ? 'vermell' : 'groc') : 'verd'}"></span>${x.trobades ? `${x.trobades} troballa${x.trobades > 1 ? 'es' : ''}` : 'cap troballa'}`
        : `<span class="semafor gris"></span>no executada`}</td>
    </tr>`).join('');

  const noExecutades = c.comprovacions.filter(x => !x.executada);

  return `
    <p class="ajuda" style="margin-top:.9rem"><b>Coherència global després de l'edició.</b>
    Executada sobre el <b>text sencer</b> (${num(c.caracters)} caràcters), no sobre el fragment editat.
    Origen: ${esc(c.origen || '—')}${c.pedacos_aplicats ? ` · ${c.pedacos_aplicats} pedaç${c.pedacos_aplicats > 1 ? 'os' : ''} aplicat${c.pedacos_aplicats > 1 ? 's' : ''}` : ''}. Zero crides.</p>
    <table class="metrica">
      <tr><th>Comprovació</th><th>Resultat</th></tr>
      ${files}
    </table>
    ${noExecutades.length ? `<div class="nota">${noExecutades.map(x => `<b>${esc(x.nom)}</b>: ${esc(x.motiu_no_executada)}`).join('<br>')}</div>` : ''}
    ${problemes.length
      ? `<p class="ajuda" style="margin-top:.6rem">${problemes.length} ${problemes.length === 1 ? 'troballa' : 'troballes'}${altes ? `, ${altes} d'alta severitat` : ''}. Les marcades com a heurística són una pista, no un veredicte.</p>` +
        problemes.map(p => `<div class="problema ${esc(p.severitat)}">
          <div>${esc(p.detall)}${p.heuristica ? ' <span style="color:var(--text3)">(heurística)</span>' : ''}</div>
          ${p.cita ? `<div class="cita">«${esc(p.cita)}»</div>` : ''}
          ${p.camp ? `<div class="cita">${esc(p.camp)}</div>` : ''}
        </div>`).join('')
      : '<p class="ajuda" style="margin-top:.6rem">Cap troballa a les comprovacions que s\'han pogut executar. Vol dir que no s\'ha trobat res del que aquestes cinc comprovacions saben buscar; no vol dir que l\'edició sigui bona.</p>'}
    <div class="accions">
      <button class="petit" onclick="executarCoherencia({ origen: 'revisió manual' });renderitzar()">Torna a validar la coherència <span style="opacity:.7">· 0 crides</span></button>
    </div>`;
}

// ── P5 ────────────────────────────────────────────────────
function renderP5() {
  const text = textActual();
  const caracters = NUCLI.comptaCaracters(text);
  const dins = caracters >= NUCLI.CONTE_MIN_CARACTERS && caracters <= NUCLI.CONTE_MAX_CARACTERS;
  const fetes = cridesFetesAlPas('costura');
  const esgotat = fetes >= LIMITS_DURS_PAS.costura;

  const rebutjats = ESTAT_CONTE.pedacos_rebutjats.length ? `
    <p class="ajuda" style="margin-top:.8rem"><b>Pedaços rebutjats (${ESTAT_CONTE.pedacos_rebutjats.length}).</b> Un pedaç rebutjat és informació útil: vol dir que el model no ha sabut citar el text literalment i que aquell canvi NO s'ha aplicat.</p>
    ${ESTAT_CONTE.pedacos_rebutjats.map(r => `<div class="problema baixa"><div>${esc(r.motiu_rebuig)}</div><div class="cita">«${esc(NUCLI.retallarParaules(r.cerca, 12))}»</div></div>`).join('')}` : '';

  let bloc = '';
  if (!dins && esgotat) {
    bloc = blocatge(
      `El conte té ${num(caracters)} caràcters i l'interval vàlid és ${num(NUCLI.CONTE_MIN_CARACTERS)}–${num(NUCLI.CONTE_MAX_CARACTERS)}. El pas de costura ja ha gastat les seves ${LIMITS_DURS_PAS.costura} crides i no en farà cap més.`,
      'Entrar en bucle de correcció és exactament el patró que encaria el sistema.',
      `<button class="resolucio petit" onclick="obrirEdicioManual()">Edita el text a mà</button>
       <button class="resolucio petit" onclick="avancarFins(6)">Accepta-ho i continua</button>`);
  } else if (!dins && fetes >= 1) {
    bloc = blocatge(
      `El conte té ${num(caracters)} caràcters. Queda ${LIMITS_DURS_PAS.costura - fetes} crida d'ajust de longitud.`, '',
      `<button class="resolucio petit" onclick="accio('b-costura-b', costuraLongitud)">Ajusta la longitud · 1 crida</button>`);
  }

  return targeta(5, 'Costura per pedaços',
    fetes ? `${fetes}/${LIMITS_DURS_PAS.costura} crides · ${num(caracters)} caràcters` : 'pendent',
    dins && fetes ? 'ok' : (fetes ? 'avis' : ''), `
    <p class="ajuda">El text acabat no es reescriu mai sencer. La costura demana una llista de pedaços <code>{cerca, substitueix}</code> i el codi els aplica només si <code>cerca</code> apareix <b>exactament un cop</b>. Sostre dur del pas: ${LIMITS_DURS_PAS.costura} crides, en qualsevol camí.</p>
    <table class="metrica">
      <tr><th>Mesura</th><th>Valor</th></tr>
      <tr><td>Caràcters amb espais</td><td class="num">${num(caracters)}</td></tr>
      <tr><td>Interval vàlid</td><td class="num">${num(NUCLI.CONTE_MIN_CARACTERS)} – ${num(NUCLI.CONTE_MAX_CARACTERS)}</td></tr>
      <tr><td>Dins de l'interval</td><td>${dins ? '<span class="semafor verd"></span>sí' : '<span class="semafor vermell"></span>no'}</td></tr>
      <tr><td>Crides gastades en aquest pas</td><td class="num">${fetes} / ${LIMITS_DURS_PAS.costura}</td></tr>
    </table>
    ${rebutjats}
    ${blocCoherencia()}
    ${bloc}
    <div class="accions">
      <button class="primari" id="b-costura" onclick="accio('b-costura', costuraEstil)"
        ${esgotat || !text ? 'disabled' : ''}>Costura d'estil <span style="opacity:.7">· 1 crida</span></button>
      <button id="b-costura-b" onclick="accio('b-costura-b', costuraLongitud)"
        ${esgotat || dins || !text ? 'disabled' : ''}>Ajusta la longitud <span style="opacity:.7">· 1 crida</span></button>
      <button onclick="executarAuditoria();avancarFins(6)" ${!text ? 'disabled' : ''}>Continua a l'auditoria</button>
      ${carregantHTML()}
    </div>
    <details style="margin-top:.8rem"><summary style="cursor:pointer;font-size:.85rem;color:var(--text2)">Edita el conte a mà</summary>
      <textarea id="edicio-manual" rows="18" style="margin-top:.5rem" onchange="editarTextAMa(this.value)">${esc(text)}</textarea>
    </details>
  `);
}

function obrirEdicioManual() {
  const det = document.querySelector('#pas-5 details');
  if (det) { det.open = true; det.scrollIntoView({ behavior: 'smooth', block: 'center' }); }
}

// ── P6 ────────────────────────────────────────────────────
function renderP6() {
  const a = ESTAT_CONTE.auditoria;
  if (!a) {
    return targeta(6, 'Auditoria determinista', 'pendent', '', `
      <p class="ajuda">Zero crides i zero tokens: tot el que es pot comprovar per codi no es pregunta a cap model.</p>
      <div class="accions">
        <button class="primari" onclick="executarAuditoria();renderitzar()" ${textActual() ? '' : 'disabled'}>Executa l'auditoria <span style="opacity:.7">· 0 crides</span></button>
      </div>`);
  }

  const perSeveritat = s => a.problemes.filter(p => p.severitat === s);
  const alta = perSeveritat('alta'), mitjana = perSeveritat('mitjana'), baixa = perSeveritat('baixa');
  const semafor = alta.length ? 'vermell' : mitjana.length ? 'groc' : 'verd';

  const llista = a.problemes.map(p => `
    <div class="problema ${esc(p.severitat)}">
      <div>${esc(p.detall)}
        ${p.heuristica ? '<span class="marca" title="Comprovació per coincidència de vocabulari: és una pista, no un veredicte">heurística</span>' : ''}
        ${p.parcial ? '<span class="marca" title="Llista tancada de formes conegudes, no és una comprovació ortogràfica">comprovació parcial</span>' : ''}
      </div>
      ${p.cita ? `<div class="cita">«${esc(p.cita)}»</div>` : ''}
      ${!p.cita && p.camp ? `<div class="cita">${esc(p.camp)}</div>` : ''}
    </div>`).join('');

  return targeta(6, 'Auditoria determinista',
    `${a.problemes.length} troballes · ${num(a.caracters)} caràcters`,
    alta.length ? 'error' : mitjana.length ? 'avis' : 'ok', `
    <table class="metrica">
      <tr><th>Mesura</th><th>Valor</th></tr>
      <tr><td>Caràcters amb espais</td><td class="num">${num(a.caracters)}</td></tr>
      <tr><td>Paraules <span style="color:var(--text3)">(informació secundària)</span></td><td class="num">${num(a.paraules)}</td></tr>
      <tr><td>Dins de l'interval ${num(NUCLI.CONTE_MIN_CARACTERS)}–${num(NUCLI.CONTE_MAX_CARACTERS)}</td><td><span class="semafor ${a.dins_interval ? 'verd' : 'vermell'}"></span>${a.dins_interval ? 'sí' : 'no'}</td></tr>
      <tr><td>Veredicte</td><td><span class="semafor ${semafor}"></span>${alta.length} altes · ${mitjana.length} mitjanes · ${baixa.length} baixes</td></tr>
      <tr><td>Crides gastades en aquest pas</td><td class="num">0</td></tr>
    </table>
    <div class="nota"><b>Sobre el lint de català:</b> al navegador la comprovació és <b>parcial</b>. Compara el text amb una llista tancada de castellanismes i anglicismes coneguts; <b>no</b> és un corrector ortogràfic i no detecta paraules inventades. La comprovació completa amb hunspell s'executa sobre el text exportat des de <code>proves/c5_lint.mjs</code>. Les troballes marcades com a <i>heurística</i> es basen en coincidència de vocabulari i són una pista, no un veredicte.</div>
    ${a.problemes.length ? llista : '<p class="ajuda" style="margin-top:.8rem">Cap problema detectat per les comprovacions deterministes. Això vol dir que no s\'ha trobat res del que aquestes comprovacions saben buscar; no vol dir que el conte sigui bo.</p>'}
    <div class="accions">
      <button class="primari" onclick="executarAuditoria();renderitzar()">Torna a executar l'auditoria <span style="opacity:.7">· 0 crides</span></button>
      <button onclick="avancarFins(7)">Continua a la lectura hostil</button>
    </div>
  `);
}

// ── P7 ────────────────────────────────────────────────────
function renderP7() {
  const l = ESTAT_CONTE.lectura;
  const tria = CLIENT.triarModelPerPas('lectura', ESTAT_CONTE.config);
  const fetesLectura = cridesFetesAlPas('lectura');
  const fetesPedac = cridesFetesAlPas('pedac');

  // L'avís sobre el model es dona ABANS de llegir, no després.
  const avisModel = tria.avis ? `<div class="avis"><b>Abans de llegir:</b> ${esc(tria.avis)}</div>` : '';

  const porta = l && l.porta_pkd ? `
    <p class="ajuda" style="margin-top:.9rem"><b>Porta PKD segons el lector.</b> Es mostra tal com ha arribat. Si contradiu el que P3 havia validat a l'escaleta, la contradicció es veu: l'escaleta declara intencions i el text és el que és.</p>
    <table class="metrica">
      <tr><th>Condició</th><th>Resposta</th><th>Cita del lector</th></tr>
      ${['esquerda', 'mentida', 'paranoia', 'empatia'].map(k => {
        const v = l.porta_pkd[k] || {};
        const si = String(v.resposta || '').toUpperCase().startsWith('S');
        return `<tr><td>${k}</td><td><span class="semafor ${si ? 'verd' : 'vermell'}"></span>${esc(v.resposta || '—')}</td><td style="color:var(--text2);font-style:italic">${esc(NUCLI.retallarParaules(v.cita || '', 14)) || '—'}</td></tr>`;
      }).join('')}
    </table>
    ${(() => {
      const gate = NUCLI.validarGatePKD(ESTAT_CONTE.escaleta.escenes);
      const negades = ['esquerda', 'mentida', 'empatia'].filter(k => {
        const v = (l.porta_pkd[k] || {}).resposta;
        return v && !String(v).toUpperCase().startsWith('S');
      });
      return (gate.valid && negades.length)
        ? `<div class="avis">L'escaleta de P3 declarava ${negades.join(', ')} i el lector diu que al text no hi són. La declaració de l'escaleta no es corregeix ni s'amaga: aquesta discrepància és precisament el que has de mirar.</div>`
        : '';
    })()}` : '';

  const defectes = l ? l.defectes.map((d, i) => `
    <div class="problema ${d.corregit ? 'baixa' : 'mitjana'}">
      <label style="display:flex;gap:.5rem;align-items:flex-start;margin:0;color:var(--text);font-size:.85rem;cursor:pointer">
        <input type="checkbox" style="width:auto;margin-top:.25rem" ${d.triat ? 'checked' : ''} ${d.corregit ? 'disabled' : ''}
          onchange="ESTAT_CONTE.lectura.defectes[${i}].triat=this.checked;desarEstat()">
        <span><span>${esc(d.per_que)}</span>${d.corregit ? '<span class="marca">ja corregit</span>' : ''}
          <div class="cita">«${esc(NUCLI.retallarParaules(d.cita, 14))}»</div></span>
      </label>
    </div>`).join('') : '';

  const descartats = l && l.descartats.length ? `
    <p class="ajuda" style="margin-top:.8rem"><b>Defectes descartats (${l.descartats.length}).</b> Un defecte sense cita literal del text no es pot comprovar ni corregir, així que no entra a la llista. Es reporta perquè quedi constància que el lector els ha dit.</p>
    ${l.descartats.map(d => `<div class="problema baixa"><div>${esc(d.per_que)}</div><div class="cita">${esc(d.motiu)}</div></div>`).join('')}` : '';

  const triats = l ? l.defectes.filter(d => d.triat).length : 0;
  const pedacEsgotat = fetesPedac >= LIMITS_DURS_PAS.pedac;

  return targeta(7, 'Lectura hostil',
    l ? `${l.defectes.length} defectes amb cita` : 'pendent', l ? 'ok' : '', `
    <p class="ajuda">Un model <b>diferent</b> del que ha escrit busca el pitjor del conte, amb cita literal obligatòria. Aquest és l'únic pas on entren els criteris d'avaluació del perfil: si arribessin al prompt del redactor, l'examen mesuraria el seu propi enunciat.</p>
    <table class="metrica">
      <tr><th>Element</th><th>Valor</th></tr>
      <tr><td>Model de prosa</td><td>${esc(ESTAT_CONTE.config.models.prosa || '—')}</td></tr>
      <tr><td>Model de lectura</td><td>${esc(tria.model || '—')} ${tria.mateix_model_que_prosa ? '<span class="marca" style="color:var(--vermell);border-color:var(--vermell)">el mateix que escriu</span>' : ''}</td></tr>
      <tr><td>Crides gastades</td><td class="num">lectura ${fetesLectura}/${LIMITS_DURS_PAS.lectura} · pedaç ${fetesPedac}/${LIMITS_DURS_PAS.pedac}</td></tr>
    </table>
    ${avisModel}
    ${defectes}
    ${descartats}
    ${porta}
    ${ESTAT_CONTE.rondes_pedac ? blocCoherencia() : ''}
    <div class="accions">
      <button class="primari" id="b-lectura" onclick="accio('b-lectura', lecturaHostil)"
        ${fetesLectura >= LIMITS_DURS_PAS.lectura || !textActual() ? 'disabled' : ''}>Llegeix-lo en contra <span style="opacity:.7">· 1 crida</span></button>
      <button id="b-pedac" onclick="accio('b-pedac', aplicarPedacDirigit)"
        ${!triats || pedacEsgotat ? 'disabled' : ''}>Corregeix els ${triats} defectes triats <span style="opacity:.7">· 1 crida</span></button>
      <button onclick="avancarFins(8)">Continua a l'exportació</button>
      ${carregantHTML()}
    </div>
    ${fetesLectura >= LIMITS_DURS_PAS.lectura ? '<div class="nota">La lectura hostil ja s\'ha fet. Aquest pas té un sostre de ' + (LIMITS_DURS_PAS.lectura + LIMITS_DURS_PAS.pedac) + ' crides en total.</div>' : ''}
    ${pedacEsgotat ? '<div class="nota">Les dues rondes de pedaç dirigit ja s\'han gastat. El que quedi s\'ha de corregir a mà a P5.</div>' : ''}
  `);
}

// ── P8 ────────────────────────────────────────────────────
function renderP8() {
  const m = metadadesConte();
  const desviacio = m.desviacio_cost;

  return targeta(8, 'Exportació', m.caracters_amb_espais ? `${num(m.caracters_amb_espais)} caràcters` : 'pendent',
    m.dins_interval ? 'ok' : 'avis', `
    <label for="camp-titol">Títol <span style="color:var(--text3)">— conceptual, d'1 a ${NUCLI.TITOL_MAX_PARAULES} paraules, tret d'un terme del conte. Editable</span></label>
    <input type="text" id="camp-titol" value="${esc(ESTAT_CONTE.titol)}" onchange="ESTAT_CONTE.titol=this.value;desarEstat();renderitzar()">
    ${(() => {
      const v = NUCLI.validarTitolConte(ESTAT_CONTE.titol, ESTAT_CONTE.dossier);
      return v.valid ? '' : `<div class="avis" style="margin-top:.4rem">${esc(v.motiu)} <span style="color:var(--text3)">${esc(v.com_resoldre)}.</span></div>`;
    })()}
    <label style="display:flex;align-items:center;gap:.5rem;margin-top:.6rem;cursor:pointer">
      <input type="checkbox" style="width:auto" ${ESTAT_CONTE.titol_al_cos ? 'checked' : ''}
        onchange="ESTAT_CONTE.titol_al_cos=this.checked;desarEstat();renderitzar()">
      <span style="font-size:.85rem;color:var(--text2)">Insereix el títol al cos del text exportat</span>
    </label>

    <table class="metrica">
      <tr><th>Mesura</th><th>Valor</th></tr>
      <tr><td>Caràcters amb espais</td><td class="num">${num(m.caracters_amb_espais)}</td></tr>
      <tr><td>Paraules</td><td class="num">${num(m.paraules)}</td></tr>
      <tr><td>Escenes</td><td class="num">${m.escenes}</td></tr>
      <tr><td>Crides reals</td><td class="num">${m.crides_reals} / ${m.sostre_crides}${m.represes_per_truncacio ? ` (${m.represes_per_truncacio} represes)` : ''}</td></tr>
      <tr><td>Crides estimades a l'inici</td><td class="num">${m.crides_estimades_inicialment == null ? '—' : m.crides_estimades_inicialment}</td></tr>
      <tr><td><b>Cost real</b></td><td class="num"><b>${usd(m.cost_real_usd)}</b></td></tr>
      <tr><td>Cost estimat a l'inici</td><td class="num">${m.cost_estimat_inicial_usd == null ? '—' : usd(m.cost_estimat_inicial_usd)}</td></tr>
      <tr><td>Desviació</td><td class="num" style="color:${desviacio == null ? 'var(--text3)' : Math.abs(desviacio) > (m.cost_estimat_inicial_usd || 1) * 0.35 ? 'var(--groc)' : 'var(--verd)'}">${desviacio == null ? '—' : (desviacio >= 0 ? '+' : '') + usd(desviacio)}</td></tr>
    </table>
    ${desviacio != null && m.cost_estimat_inicial_usd > 0 && Math.abs(desviacio) > m.cost_estimat_inicial_usd * 0.35
      ? `<div class="avis">L'estimació inicial s'ha desviat un ${Math.round(Math.abs(desviacio) / m.cost_estimat_inicial_usd * 100)}% del cost real. Es mostra perquè es vegi: una estimació que falla sistemàticament és una estimació que no serveix.</div>` : ''}
    ${m.mode_demostracio ? '<div class="nota">Aquest conte s\'ha generat en <b>mode demostració</b>: el text no ve de cap model i les metadades ho diuen.</div>' : ''}

    <div class="accions">
      <button class="primari" onclick="exportarTXT()" ${m.caracters_amb_espais ? '' : 'disabled'}>Exporta TXT</button>
      <button onclick="exportarMD()" ${m.caracters_amb_espais ? '' : 'disabled'}>Exporta Markdown amb metadades</button>
      <button onclick="exportarMetadades()" ${m.caracters_amb_espais ? '' : 'disabled'}>Exporta només les metadades</button>
      <button onclick="exportarProjecte()">Exporta el projecte (.json)</button>
    </div>
    <p class="ajuda">L'exportació TXT i el cos del Markdown porten el conte sol, sense capçalera. Les metadades van en un bloc separat al final del Markdown o en un fitxer a part.</p>
  `);
}

// ── Renderitzat general ───────────────────────────────────
function renderitzar() {
  const avisos = ESTAT_CONTE.avisos.length
    ? `<div class="avis"><b>Avisos</b><ul style="margin:.4rem 0 0;padding-left:1.1rem">${ESTAT_CONTE.avisos.map(a => `<li>${esc(a)}</li>`).join('')}</ul>
       <div class="accions"><button class="petit" onclick="ESTAT_CONTE.avisos=[];desarEstat();renderitzar()">Descarta'ls</button></div></div>`
    : '';

  document.getElementById('passos').innerHTML =
    avisos + renderP0() + renderP1() + renderP2() + renderP3() + renderP4() + renderP5() + renderP6() + renderP7() + renderP8();
  renderitzarProgres();
}

// ═══════════════════════════════════════════════════════════
//  ACCIONS DE CONFIGURACIÓ
// ═══════════════════════════════════════════════════════════

function desarClau(proveidor, valor) {
  ESTAT_CONTE.config.claus[proveidor] = String(valor || '').trim();
  desarEstat();
  renderitzar();
}

function actualitzarEstimacio() {
  ESTAT_CONTE.estimacio = CLIENT.estimarCostConte(
    ESTAT_CONTE.dossier,
    ESTAT_CONTE.escaleta.escenes.length ? ESTAT_CONTE.escaleta : null,
    ESTAT_CONTE.config.models);
  desarEstat();
  renderitzar();
}

function restaurarModelsPerDefecte() {
  const perProveidor = CLIENT.modelsPerProveidor();
  const registre = CLIENT.registreModels();
  const primer = rol => {
    for (const prov of Object.keys(perProveidor)) {
      const id = perProveidor[prov][rol];
      if (registre[id]) return id;
    }
    return Object.keys(registre)[0] || '';
  };
  ESTAT_CONTE.config.models = {
    arquitecte: primer('arquitectura'),
    prosa: primer('generacio'),
    lectura: primer('draft')
  };
  actualitzarEstimacio();
}

function alternarDemo(activar) {
  ESTAT_CONTE.config.demo = !!activar;
  if (activar) DEMO_CONTE.DemoConte.instalar();
  else DEMO_CONTE.DemoConte.desinstalar();
  // El mode demostració no necessita clau real, però el client n'exigeix una:
  // se'n posa una de fictícia i visible perquè quedi clar que no és cap clau.
  if (activar) {
    ['anthropic', 'openai', 'gemini'].forEach(p => {
      if (!ESTAT_CONTE.config.claus[p]) ESTAT_CONTE.config.claus[p] = 'demo-sense-clau';
    });
  } else {
    ['anthropic', 'openai', 'gemini'].forEach(p => {
      if (ESTAT_CONTE.config.claus[p] === 'demo-sense-clau') ESTAT_CONTE.config.claus[p] = '';
    });
  }
  desarEstat();
  renderitzar();
}

function reiniciarProjecte() {
  const claus = ESTAT_CONTE.config.claus;
  const models = ESTAT_CONTE.config.models;
  const demo = ESTAT_CONTE.config.demo;
  ESTAT_CONTE = estatBuit();
  ESTAT_CONTE.config.claus = claus;
  ESTAT_CONTE.config.models = models;
  ESTAT_CONTE.config.demo = demo;
  CLIENT.reiniciarComptador();
  actualitzarEstimacio();
}

// ═══════════════════════════════════════════════════════════
//  ARRENCADA
// ═══════════════════════════════════════════════════════════

function arrencar() {
  carregarEstat();

  const problemes = CLIENT.validarDefaultsModels();
  if (problemes.length) ESTAT_CONTE.avisos.push('Models per defecte desalineats amb el registre: ' + problemes.join(' · '));

  const registre = CLIENT.registreModels();
  if (!ESTAT_CONTE.config.models.arquitecte || !registre[ESTAT_CONTE.config.models.arquitecte]) {
    restaurarModelsPerDefecte();
  } else {
    actualitzarEstimacio();
  }

  renderitzar();
  if (ESTAT_CONTE.pas_obert >= 0) {
    const el = document.getElementById('pas-' + ESTAT_CONTE.pas_obert);
    if (el) el.scrollIntoView({ block: 'start' });
  }
}

if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', arrencar, { once: true });
} else {
  arrencar();
}
</script>
</body>
</html>
